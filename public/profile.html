            async function saveProfileField(payload, okText) {
              // 资料类字段统一走这一条: 昵称 / 简介 / 自定义信息
              try {
                const response = await fetch('/api/profile', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload),
                  cache: 'no-store'
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.error || '更新失败');
                if (currentUser) Object.assign(currentUser, payload);
                if (okText) showProfileStatus(okText, 'ok'); // 空串 = 不弹文字 (交给按钮自己反馈)
                return true;
              } catch (error) {
                showProfileStatus(error.message, 'error');
                return false;
              }
            }

            /* 资料表单
                  头像 / 昵称 / 简介 / 邮箱 / 位置 / 其他信息 一起交。「保存更改」在「没改动」或
                  「改回原样」时都是禁用状态, 所以拿一份 baseline 做对比, 存成功后再把 baseline 换成新值。
                  邮箱存在 users.email (账号邮箱), 位置仍存在 profiles.other 的「标签: 内容」行 */
            const OTHER_FIELDS = [
              { key: 'location', label: '位置', el: 'extra-location' }
            ];

            // 老数据在 profiles.other 里留过「邮箱: xxx」(现在归 users.email 管) 与「链接: xxx」
            // —— 读到就丢掉, 下次保存 other 时顺手从库里清掉, 不用专程跑迁移
            const LEGACY_OTHER_LABELS = ['邮箱', '链接'];

            /* 个性化那两张卡片的状态 (与表单一起「保存更改」/「取消」): { bg_image, bg_blur, chat_bg, chat_blur },
                  空串 = 没设置。
                  它们是卡片 (不是输入框), 所以单独存一份, readProfileForm() 会把它并进去 */
            const CUSTOM_BLUR_MAX_PX = 24; // 模糊度 100 对应 24px
            let customState = { bg_image: '', bg_blur: 0, chat_bg: '', chat_blur: 0 };

            // 0~100 → px (背景图层用; 缩略图与真背景共用同一套换算)
            function blurPx(value) {
              const n = Math.max(0, Math.min(100, parseInt(value, 10) || 0));
              return (n / 100 * CUSTOM_BLUR_MAX_PX).toFixed(1) + 'px';
            }

            let profileBaseline = {
              nickname: '', bio: '', email: '', location: '', rest: ''
            };
            let savedFlashTimer = null;

            function splitOther(raw) {
              // other → { location, rest }
              const out = { location: '', rest: [] };
              cleanOther(raw).split(/\r?\n/).forEach((line) => {
                const text = line.trim();
                if (!text) return;
                const idx = text.search(/[:：]/);
                const label = idx < 0 ? '' : text.slice(0, idx).trim();
                const value = idx < 0 ? '' : text.slice(idx + 1).trim();
                const hit = OTHER_FIELDS.find((f) => f.label === label);
                if (hit) out[hit.key] = value;
                else if (LEGACY_OTHER_LABELS.indexOf(label) >= 0) return; // 旧邮箱行: 丢弃
                else out.rest.push(text);
              });
              out.rest = out.rest.join('\n');
              return out;
            }

            function composeOther(form) {
              // 专属字段在前, 自由行在后 (空的不写)
              const lines = [];
              OTHER_FIELDS.forEach((f) => {
                if (form[f.key]) lines.push(f.label + '：' + form[f.key]);
              });
              form.rest.split(/\r?\n/).forEach((line) => {
                if (line.trim()) lines.push(line.trim());
              });
              return lines.join('\n');
            }

            function readProfileForm() {
              const emailEl = document.getElementById('email-input');
              // 已验证的邮箱是 readonly, 不参与表单对比与提交
              const emailLocked = emailEl.readOnly;
              const form = {
                nickname: document.getElementById('nickname-input').value.trim(),
                bio: document.getElementById('bio-input').value.trim(),
                email: emailLocked ? '' : emailEl.value.trim(),
                rest: document.getElementById('other-input').value
              };
              OTHER_FIELDS.forEach((f) => { form[f.key] = document.getElementById(f.el).value.trim(); });
              // 个性化那四个字段不在这里 —— 它们已经搬去「个性化」页签, 改完立刻存
              //    (见 saveCustomFields), 不参与这个表单的脏检查
              return form;
            }

            function sameProfileForm(a, b) {
              return a.nickname === b.nickname && a.bio === b.bio && a.rest === b.rest
                && a.email === b.email
                && OTHER_FIELDS.every((f) => a[f.key] === b[f.key]);
            }

            function refreshProfileSaveState() {
              const now = readProfileForm();
              const changed = !sameProfileForm(now, profileBaseline);
              const save = document.getElementById('profile-save');
              const cancel = document.getElementById('profile-cancel');
              // 有改动就把「已保存」的灰按钮换回「保存更改」
              if (changed) resetSaveButton();
              // 「取消」只在真有改动时出现 (存完就会自己消失)
              if (cancel) cancel.hidden = !changed;
              // 昵称不能空: 空着不给存 (后端也会拦, 但没必要跑一趟)
              if (!now.nickname) {
                save.disabled = true;
                return;
              }
              save.disabled = !changed || save.classList.contains('is-saved');
            }

            function cancelProfileChanges() {
              // 把表单整体退回上一次保存的样子 (回到 baseline)
              document.getElementById('nickname-input').value = profileBaseline.nickname;
              document.getElementById('bio-input').value = profileBaseline.bio;
              document.getElementById('other-input').value = profileBaseline.rest;
              // 已验证的邮箱在 baseline 里是空串 (那是为了让脏检查干净), 直接写回去
              // 就会把框清空、只留一行占位符
              document.getElementById('email-input').value = profileBaseline.email
                || (currentUser && currentUser.email) || '';
              OTHER_FIELDS.forEach((f) => { document.getElementById(f.el).value = profileBaseline[f.key]; });
              // 个性化不在这里回退 (它不归这个表单管, 改完就已经存下去了)
              autoGrow(document.getElementById('bio-input'));
              autoGrow(document.getElementById('other-input'));
              resetSaveButton();
              refreshProfileSaveState();
              renderEmailAction(currentUser);
            }

            function resetSaveButton() {
              const save = document.getElementById('profile-save');
              clearTimeout(savedFlashTimer);
              save.classList.remove('is-saved');
              save.dataset.i18n = 'opt.save-changes'
              save.textContent = '保存更改';
            }

            function showSavedState() {
              // 存完的反馈: 按钮变成灰底「已保存」, 下次一有改动就变回去
              const save = document.getElementById('profile-save');
              clearTimeout(savedFlashTimer);
              save.classList.add('is-saved');
              save.innerHTML = ICONS.check + '<span>' + I18N.t('opt.saved-changes') +'</span>';
              save.disabled = true;
              savedFlashTimer = setTimeout(() => {
                resetSaveButton();
                refreshProfileSaveState();
              }, 2600);
            }

            function fillProfileForm(user) {
              const other = splitOther(user.other);
              profileBaseline = {
                nickname: user.nickname || user.username || '',
                bio: user.bio || '',
                // 邮箱一律只读: 验证前不给改, 验证后也只能换绑
                // → baseline 永远记空串, 脏检查永远不会因为邮箱而变脏
                email: '',
                location: other.location,
                rest: other.rest
              };
              // 个性化 (归「个性化」页签管, 不进 baseline)
              customState = {
                bg_image: user.bg_image || '',
                bg_blur: user.bg_blur || 0,
                chat_bg: user.chat_bg || '',
                chat_blur: user.chat_blur || 0
              };
              // 字体 (同上): 三个偏好值, 画成三组单选框 (服务端没传 = 默认字体)
              customFonts = {
                chat: normalizeFontValue(user.font_chat),
                forum: normalizeFontValue(user.font_forum),
                article: normalizeFontValue(user.font_article)
              };
              renderLanguageSelect();
              renderFontChoices();
              initCtxCapture();
              initRainSound();
              initDevTools();
              initTermQuoteKey();
              document.getElementById('nickname-input').value = profileBaseline.nickname;
              document.getElementById('bio-input').value = profileBaseline.bio;
              document.getElementById('other-input').value = profileBaseline.rest;
              // 但框里要显示真实邮箱 (baseline 记空串只是为了让脏检查干净)
              document.getElementById('email-input').value = profileBaseline.email || (user.email || '');
              OTHER_FIELDS.forEach((f) => { document.getElementById(f.el).value = profileBaseline[f.key]; });
              renderCustomState();
              // 填完再量一次高度 (textarea 换行要自己长高)
              autoGrow(document.getElementById('bio-input'));
              autoGrow(document.getElementById('other-input'));
              resetSaveButton();
              refreshProfileSaveState();
            }

            /* 默认一行高, 有换行就自动长高 (用 scrollHeight 量, 再把边框补回去 —— box-sizing 是 border-box,
               不加这 4px 每次都会少一截)。
               空值时要交回给 rows="1" —— Chrome 会把换行的 placeholder 也算进 scrollHeight */
            function autoGrow(elm) {
              if (!elm.value) {
                elm.style.height = '';
                return;
              }
              elm.style.height = 'auto';
              const border = elm.offsetHeight - elm.clientHeight;
              elm.style.height = (elm.scrollHeight + border) + 'px';
            }

            /* 个性化: 主页背景 / 聊天背景
                  两张卡片: 主页背景 (别人看得到) + 聊天背景 (只有自己看得到), 住在独立的一页「个性化 › 背景」里。
                  图片存在桶里的 img/user/<用户名>/profile-image 与 chat-image (换图覆盖同一个对象),
                  地址落在 profiles 的四个列上。
                  它不走资料那个表单的保存按钮 —— 上传 / 移除 / 松开滑条就立刻写库
                  (以前跟表单一起交, 只上传不点保存就等于没存) */

            let customSaveTimer = null;

            /* 个性化: 字体
                  三行 (聊天 / 论坛 / 文章) × 两个单选 (默认字体 / 想念是枫糖海盐味)。值只存在自己那份 profiles 里,
                  由 core.js 写成 <html data-font-*>, 字体栈在 main.css —— 所以别人看到的一直是他们自己选的那套。
                  与背景那两块一样立刻存 (不走资料表单的保存键)。
                  选项清单用 core.js 的 FONT_CHOICES (与 worker.js 的 FONT_VALUES 对齐), 这里不另抄一份 */
            let customFonts = { chat: '', forum: '', article: '' };
            const FONT_SCOPE_LABELS = { chat: '聊天', forum: '论坛', article: '文章' };

            /* 全局接替右键: 开关状态存在本机, 开关本身只负责写回去。
                  真正的拦截在 ui.js 的 document contextmenu 里 (那里才有全局视野) */
            /* 开发者功能开关 (仅站长, 默认开)
                  关掉就藏起 D1 / R2 页签与星点卡片的「重新指定 ID」。
                  存在本机 (localStorage) —— 这是「这台设备要不要看这些」的习惯, 不跨设备 */
            const DEV_KEY = 'foraine.dev.tools';

            function devToolsOn() {
              try { return localStorage.getItem(DEV_KEY) !== '0'; } catch (err) { return true; }
            }

            function applyDevTools() {
              const on = devToolsOn();
              /* 这里只看了「开关」没看身份 —— 开关默认是开的, 于是非站长也有这两个页签 (但切不进去)。
                    开关只管站长自己要不要看, 身份那关单独算 */
              const isOwner = !!(currentUser && (currentUser.permissions || []).indexOf('dev.access') >= 0);
              const show = on && isOwner;
              const d1Tab = document.getElementById('profile-tab-d1');
              const r2Tab = document.getElementById('profile-tab-r2');
              const siteTab = document.getElementById('profile-tab-site');
              if (d1Tab) d1Tab.hidden = !show;
              if (r2Tab) r2Tab.hidden = !show;
              if (siteTab) siteTab.hidden = !show;
              // 正停在被藏起来的页签上 → 退回「资料」
              const active = document.querySelector('.profile-tab.is-active');
              if (!show && active && (active.dataset.tab === 'd1' || active.dataset.tab === 'r2' || active.dataset.tab === 'site')) {
                switchProfileTab('profile');
              } else {
                moveTabIndicator();
              }
            }

            function initDevTools() {
              const box = document.getElementById('dev-tools');
              if (box) {
                box.checked = devToolsOn();
                box.onchange = () => {
                  try { localStorage.setItem(DEV_KEY, box.checked ? '1' : '0'); } catch (err) { /* 无痕模式 */ }
                  applyDevTools();
                  showToast(I18N.t(box.checked ? 'target.activated': 'target.deactivated', {target: I18N.t('name.advanced.devtools')}), 'info');
                };
              }
              applyDevTools();
            }

            /* 终端文章面板的 QuoteKey 开关 (只有持有 terminal.keyviewer 的人有这张卡; 只影响本机) */
            const TERM_KEY_STORE = 'foraine.term.quoteKey';

            function termQuoteKeyOn() {
              try { return localStorage.getItem(TERM_KEY_STORE) === '1'; } catch (err) { return false; }
            }

            function initTermQuoteKey() {
              const card = document.getElementById('card-term-quotekey');
              const box = document.getElementById('term-quotekey');
              if (!card || !box) return;
              const can = !!(currentUser && (currentUser.permissions || []).indexOf('terminal.keyviewer') >= 0);
              card.hidden = !can;
              if (!can) return;
              box.checked = termQuoteKeyOn();
              box.onchange = () => {
                try { localStorage.setItem(TERM_KEY_STORE, box.checked ? '1' : '0'); } catch (err) { /* 无痕模式 */ }
                showToast(I18N.t(box.checked ? 'target.activated' : 'target.deactivated', { target: I18N.t('name.terminal.quotekey') }), 'info');
              };
            }

            function initCtxCapture() {
              const box = document.getElementById('ctx-capture');
              if (!box) return;
              box.checked = typeof ctxCaptureOn === 'function' ? ctxCaptureOn() : false;
              box.onchange = () => {
                if (typeof setCtxCapture === 'function') setCtxCapture(box.checked);
                showToast(box.checked ? '已接管本页的右键' : '已交还浏览器右键', 'ok');
              };
            }

            /* 雨声: 真正的播放在 ui.js 的雨声模块里 (全站共用), 这里只切开关;
                  开的那一刻要顺手叫它开始播 (用户就在点它, 这是最好的时机) */
            function initRainSound() {
              const box = document.getElementById('rain-sound');
              if (!box) return;
              const on = typeof rainSoundOn === 'function' ? rainSoundOn() : false;
              box.checked = on;
              box.onchange = () => {
                if (typeof setRainSound === 'function') setRainSound(box.checked);
                showToast(box.checked ? '雨声已开启（此刻起全站循环）' : '雨声已关闭', 'ok');
              };
            }

            /* 语言下拉: 选项来自 i18n.js 的清单, 切了就换设备偏好并重载 (文案散在页面与脚本里, 重载最一致) */
            function renderLanguageSelect() {
              const sel = document.getElementById('site-language');
              if (!sel || !window.I18N) return;
              sel.innerHTML = '';
              I18N.LANGS.forEach((item) => {
                const opt = document.createElement('option');
                opt.value = item.code;
                opt.textContent = item.label;
                sel.appendChild(opt);
              });
              sel.value = I18N.lang;
              sel.addEventListener('change', () => I18N.setLang(sel.value));
            }

            function renderFontChoices() {
              const box = document.getElementById('font-choices');
              if (!box) return; // 看别人主页时这一页整块被删掉了
              box.innerHTML = '';
              FONT_SCOPES.forEach((scope) => {
                const row = el('div', 'font-row');
                row.appendChild(el('span', 'font-row-label', FONT_SCOPE_LABELS[scope] || scope));
                const options = el('div', 'font-options');
                FONT_CHOICES.forEach((choice) => {
                  const option = el('label', 'font-option');
                  const input = document.createElement('input');
                  input.type = 'radio';
                  input.name = 'font-' + scope; // 同名 = 同组, 浏览器自己管互斥
                  input.value = choice.value;
                  input.checked = normalizeFontValue(customFonts[scope]) === choice.value;
                  input.addEventListener('change', () => {
                    if (input.checked) saveUserFont(scope, choice.value);
                  });
                  option.appendChild(input);
                  // 选项文字用它自己的字体画 —— 「想念是枫糖海盐味」那项本身就是预览
                  option.appendChild(el('span', choice.value ? 'font-hand' : '', choice.label));
                  options.appendChild(option);
                });
                row.appendChild(options);
                box.appendChild(row);
              });
            }

            async function saveUserFont(scope, value) {
              customFonts = Object.assign({}, customFonts, { [scope]: value });
              // 先当场生效 (不用等接口回来), 再写库; 成功后不要重画单选框 (会丢焦点, 状态本来就对)
              setUserFonts(customFonts);
              try {
                await apiPost('/api/profile', {
                  font_chat: customFonts.chat,
                  font_forum: customFonts.forum,
                  font_article: customFonts.article
                });
                if (currentUser) {
                  currentUser.font_chat = customFonts.chat;
                  currentUser.font_forum = customFonts.forum;
                  currentUser.font_article = customFonts.article;
                }
                showProfileStatus('字体已保存', 'ok');
              } catch (err) {
                showProfileStatus(err.message || '保存失败，请稍后再试', 'error');
              }
            }

            /* 只把四个字段发过去, 服务端看到别的字段没传就不动它们。
                  滑条拖的是 input 事件 (实时预览), 真正发请求的是 change ——
                  不然拖一下就是几十个请求 */
            async function saveCustomFields(quiet) {
              clearTimeout(customSaveTimer);
              try {
                await apiPost('/api/profile', {
                  bg_image: customState.bg_image || '',
                  bg_blur: customState.bg_blur,
                  chat_bg: customState.chat_bg || '',
                  chat_blur: customState.chat_blur
                });
                // 顺手把自己那份会话缓存也更新一下 (别的地方要看 chat_bg)
                if (currentUser) {
                  currentUser.bg_image = customState.bg_image || null;
                  currentUser.bg_blur = customState.bg_blur;
                  currentUser.chat_bg = customState.chat_bg || null;
                  currentUser.chat_blur = customState.chat_blur;
                }
                showProfileStatus(quiet ? '已保存' : '背景已保存', 'ok');
              } catch (err) {
                showProfileStatus(err.message || '保存失败，请稍后再试', 'error');
              }
            }

            // 把 customState 画到两张卡片上 (缩略图 / 移除键 / 模糊度滑条)
            function renderCustomState() {              ['profile', 'chat'].forEach((kind) => {
                const key = kind === 'profile' ? 'bg_image' : 'chat_bg';
                const blurKey = kind === 'profile' ? 'bg_blur' : 'chat_blur';
                const url = customState[key] || '';
                const blur = customState[blurKey] || 0;

                const thumb = document.getElementById('thumb-' + kind + '-bg');
                if (thumb) {
                  thumb.innerHTML = '';
                  if (url) {
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = '';
                    img.style.filter = 'blur(' + blurPx(blur) + ')';
                    thumb.appendChild(img);
                  } else {
                    thumb.appendChild(el('span', 'custom-thumb-empty', I18N.t('opt.NotSet')));
                  }
                }
                const clear = document.getElementById('clear-' + kind + '-bg');
                if (clear) clear.hidden = !url;
                const slider = document.getElementById('blur-' + kind);
                if (slider) {
                  slider.value = String(blur);
                  slider.style.setProperty('--fill', blur + '%');   // 滑条已抵达段的比例
                }
                /* 没设图: 整张卡片收起缩略图 */
                const card = document.getElementById('card-' + kind + '-bg');
                if (card) card.classList.toggle('is-empty', !url);
                const value = document.getElementById('blur-' + kind + '-value');
                if (value) value.textContent = String(blur);
                /* 模糊度横条只在有图的时候展开, 而且展开/收起要有动画 —— 所以不用 hidden, 改加 .is-on,
                      由 page-profile.css 的 max-height + opacity 过渡负责动 (上传后 / 移除后都会跑) */
                const blurRow = document.getElementById('blur-row-' + kind);
                if (blurRow) blurRow.classList.toggle('is-on', !!url);
              });
              applyBackgrounds();
            }

            // 看别人主页时拿到的公开背景 (bg_image / bg_blur); 自己的页面不用它
            let viewedUserBg = null;

            /* 背景落地: 主页背景 → html.has-bg-image, body::before 那层紫色柔光换成图片;
                  聊天背景 → html.has-chat-bg, .chat-body 底下的伪元素铺图 (样式在 main.css, 私信页也用)。
                  两者都立刻生效 (选完图不保存也能先看到效果), 保存后才是别人的事 */
            function applyBackgrounds(skipLayerSync) {
              const root = document.documentElement;
              // 自己的资料页用表单里那份; 别人的主页用 /api/user 拿回来的公开背景
              const bgImage = isPublicView ? ((viewedUserBg && viewedUserBg.bg_image) || '') : customState.bg_image;
              const bgBlur = isPublicView ? ((viewedUserBg && viewedUserBg.bg_blur) || 0) : customState.bg_blur;
              if (bgImage) {
                root.style.setProperty('--bg-img', 'url("' + bgImage.replace(/"/g, '%22') + '")');
                root.style.setProperty('--bg-blur', blurPx(bgBlur));
                /* 只有真的模糊了才给 --bg-filter: blur(0px) 也不是空操作 —— 它会把图层提成独立纹理,
                      在缩放/重采样下边缘会成一条 1px 细线 */
                root.style.setProperty('--bg-filter', bgBlur > 0 ? 'blur(' + blurPx(bgBlur) + ')' : 'none');
                root.classList.add('has-bg-image');
              } else {
                root.classList.remove('has-bg-image');
                root.style.removeProperty('--bg-img');
                root.style.removeProperty('--bg-blur');
                root.style.removeProperty('--bg-filter');
              }
              // 聊天背景是私密项: 别人的主页上不该套上「我的」聊天背景
              if (!isPublicView && customState.chat_bg) {
                root.style.setProperty('--chat-img', 'url("' + customState.chat_bg.replace(/"/g, '%22') + '")');
                root.style.setProperty('--chat-blur', blurPx(customState.chat_blur));
                root.classList.add('has-chat-bg');
              } else {
                root.classList.remove('has-chat-bg');
                root.style.removeProperty('--chat-img');
                root.style.removeProperty('--chat-blur');
              }
              // 图层高度要按新的内容量重算一次 (拖模糊滑条时跳过 —— 模糊不影响高度,
              // 而量高度会强制回流)
              if (!skipLayerSync) syncBgLayer();
            }

            /* 背景画布 / 可见高度
                  --bg-fade-h 画布高 (一屏 + 200px, 只跟视口有关 → 渐变几何恒定) / --bg-visible-h 实际显示多高
                  (跟着页脚位置走 = 「裁剪」那一下) / --bg-img-size 图片 cover 到固定画布后的尺寸。
                  不能靠 clip-path 裁 (它只裁绘制, 不减可滚动区域, 元素高过内容照样撑出滚动条); 内容高要自己算
                  (页脚底边 + 下外边距), 不能读 scrollHeight (图层 absolute;top:0 比内容高就会把它顶上去 → 自激);
                  拖模糊滑条时不要调它 (量高度会强制回流, 滑条会掉手感)。
                  长页面上只剩顶上 ~600px 有图, 是被接受的行为 (别再改回铺满整屏那种横幅效果) */
            const BG_TAIL_PX = 0;    // 裁到哪: 0 = 正好停在页脚上沿
            const BG_EXTRA_VH = 200; // 画布 = 一屏 + 这么多
            let bgProbeUrl = '';
            let bgProbeW = 0;
            let bgProbeH = 0;
            let bgCanvasKey = ''; // 画布尺寸指纹: 同一个画布不用重算

            /* 把「cover 到固定画布」的尺寸算出来写进 --bg-img-size。
                  为什么要自己算: 元素高会随裁剪变小, 直接用 cover 会跟着换比例尺 (看着像缩放)。
                  图片可能跨域, 这里只看 naturalWidth/Height (不用 canvas, 不受 CORS 限制) */
            function syncBgImageSize(url, fadeH) {
              if (!url) return;
              const root = document.documentElement;
              const apply = () => {
                if (!bgProbeW || !bgProbeH) return;
                // 用 innerWidth 而不是 clientWidth —— 竖向滚动条出现/消失会让 clientWidth 跳 7~15px,
                // 而滚动条又取决于当前页签的内容多少, 那就会变成「切页签图微微缩放」。
                // innerWidth 不随内容变, 于是画布宽恒定 (图稍微宽一点没关系, 反正会被裁)
                const canvasW = Math.max(root.clientWidth, window.innerWidth);
                const key = canvasW + 'x' + Math.round(fadeH);
                if (key === bgCanvasKey) return;
                bgCanvasKey = key;
                const scale = Math.max(canvasW / bgProbeW, fadeH / bgProbeH);
                root.style.setProperty('--bg-img-size',
                  Math.round(bgProbeW * scale) + 'px ' + Math.round(bgProbeH * scale) + 'px');
              };
              if (url !== bgProbeUrl) {
                bgProbeUrl = url;
                bgProbeW = 0;
                bgProbeH = 0;
                bgCanvasKey = '';
                const probe = new Image();
                probe.onload = () => {
                  bgProbeW = probe.naturalWidth;
                  bgProbeH = probe.naturalHeight;
                  apply();
                };
                probe.onerror = () => { /* 取不到尺寸就退化成 CSS 里的兜底值 */ };
                probe.src = url;
                return;
              }
              apply();
            }

            function syncBgLayer() {
              const root = document.documentElement;
              if (!root.classList.contains('has-bg-image')) return;
              const footer = document.querySelector('.site-footer');
              if (!footer) return; // layout.js 还没把页脚挂上
              const vh = root.clientHeight;
              // 画布: 只跟视口有关 —— 这条要是变了, 切页签背景就会「像缩放」
              const fadeH = vh + BG_EXTRA_VH;
              const rect = footer.getBoundingClientRect();
              const marginBottom = parseFloat(getComputedStyle(footer).marginBottom) || 0;
              const footTop = rect.top + window.scrollY;
              const contentH = rect.bottom + window.scrollY + marginBottom;
              /* 显示到哪: 正好到页脚上沿, 再给 80% 画布高的下限兜底, 最多到画布底。
                    不写 max(vh, …): 那个「至少铺满一屏」会把裁剪点顶到折线。
                    下限必须到 80% —— 渐变的纯底色停点在画布 80% 处 (见 page-profile.css 那串 gradient),
                    页脚比它靠上时图层会在「渐变还没到底色」的地方被硬砍一刀 (= 贯穿全页的 1px 细线)。
                    0.8 必须与 page-profile.css 的 var(--c-page-bg) 80% 一致, 改一边要改两边 */
              const BG_SOLID_FRACTION = 0.8;
              const visible = Math.min(fadeH, Math.max(240, footTop + BG_TAIL_PX, fadeH * BG_SOLID_FRACTION));

              const setVar = (name, value) => {
                if (root.style.getPropertyValue(name) !== value) root.style.setProperty(name, value);
              };
              /* 图层底边要落在整数设备像素上 (设备像素 = css px × devicePixelRatio × 浏览器缩放)。
                    非整数设备像素的那一行会被抗锯齿混出一层, 就是「1px 细线」。
                    +1 是再往下多铺 1 个设备像素: 那一行本来就是纯页面底色, 这样边缘既不落在半像素上,
                    也不怕图片 / 渐变有亚像素偏移 */
              const devFactor = window.devicePixelRatio || 1;
              const snapDevice = (v) => (Math.ceil(v * devFactor) + 1) / devFactor;
              setVar('--bg-fade-h', Math.round(fadeH) + 'px');
              setVar('--bg-visible-h', snapDevice(visible) + 'px');
              // 图尺寸依赖画布宽高, 一起更新 (画布变了会自动重算)
              const url = String(root.style.getPropertyValue('--bg-img') || '')
                .replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
              syncBgImageSize(url, fadeH);
              // 调试用: 内容高 / 可见高
              root.dataset.bgContentH = String(Math.round(contentH));
              root.dataset.bgVisibleH = String(Math.round(visible));
            }

            /* 内容量会变（数据回来、头像图加载、折行、切页签），所以不能只量一次 */
            let bgLayerRaf = 0;
            function queueBgLayerSync() {
              if (bgLayerRaf) return;
              bgLayerRaf = requestAnimationFrame(() => {
                bgLayerRaf = 0;
                syncBgLayer();
              });
            }

            function bindBgLayerSync() {
              window.addEventListener('resize', queueBgLayerSync);
              window.addEventListener('load', queueBgLayerSync);
              if (window.ResizeObserver) {
                const ro = new ResizeObserver(queueBgLayerSync);
                // 盯住内容那一块（背景图层是 body 的伪元素, 不影响它的高度 → 不会自激）
                ro.observe(document.querySelector('.page-layout') || document.body);
              }
              if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(queueBgLayerSync).catch(() => {});
              }
            }

            /* 上传背景图: 和文章编辑器的「插入图片」一套 —— 桌面先弹框 (拖放区 + 点选 + 预览),
                  选好点「使用这张」才真的换上; 手机没有拖放这回事, 直接开系统选择器。
                  上传与「换上」是两步 —— 文件先传进桶 (URL 放进 pendingCustomImage),
                  点确认才写进 customState + 存档, 这样中途关掉弹窗不会把旧图换掉 */
            const PROFILE_TOUCH_ONLY = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
            const IMG_UPLOAD_HINT = '也可以点这里选本地文件 · PNG / JPG / WebP / GIF · 20 MB 以内';
            let pendingCustomImage = null; // { kind, url, name }

            function formatFileSize(bytes) {
              if (!bytes && bytes !== 0) return '';
              if (bytes < 1024) return bytes + ' B';
              if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
              return (bytes / 1024 / 1024).toFixed(1) + ' MB';
            }

            /* 这次「选文件」是为了什么: { kind: 'profile'|'chat', preview: bool }
                  以前这个意图存在 picker.dataset.preview 上, 而 change 处理器一进来就把它清成 '' ——
                  只要有一次没走完 (对话框被取消 / 连着点两下), 下一次就会掉进「选完立刻换上」那条路,
                  表现就是「第一次没反应、第二次才生效」。改成普通变量, 只有 change 那一次读它 */
            let customImageIntent = null;

            function pickCustomImage(kind) {
              const picker = document.getElementById('custom-image-file');
              if (!picker) return;
              picker.dataset.kind = kind;
              picker.value = ''; // 同一张图连选两次也要能触发 change
              if (PROFILE_TOUCH_ONLY) {
                customImageIntent = { kind, preview: false }; // 手机: 没有拖放这回事, 选完直接换上
                picker.click();
                return;
              }
              customImageIntent = { kind, preview: true }; // 桌面: 选完只上传+预览, 等「使用」

              pendingCustomImage = null;
              showMessage(
                '<p class="modal-preview-title">上传' + (kind === 'chat' ? '聊天背景' : '主页背景') + '</p>' +
                '<div class="img-drop" id="custom-img-drop">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="M12 16V4"></path><path d="m7.5 8.5 4.5-4.5 4.5 4.5"></path>' +
                    '<path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"></path>' +
                  '</svg>' +
                  '<p class="img-drop-title">把图片拖到这里</p>' +
                  '<p class="img-drop-hint">' + IMG_UPLOAD_HINT + '</p>' +
                '</div>' +
                '<div class="img-picked" id="custom-img-picked" hidden>' +
                  '<img id="custom-img-picked-img" alt="">' +
                  '<p class="img-picked-meta" id="custom-img-meta"></p>' +
                '</div>' +
                /* 上传中: 传完之前先把拖放区换成这一块, 不然选完文件看着就是「什么都没发生」。 */
                '<div class="img-picked" id="custom-img-busy" hidden>' +
                  '<div class="busy-spinner"></div>' +
                  '<p class="img-picked-meta" id="custom-img-busy-text">上传中…</p>' +
                '</div>' +
                '<div class="confirm-actions">' +
                  '<button type="button" class="btn" id="custom-img-confirm" disabled>使用</button>' +
                  '<button type="button" class="btn-outline" onclick="closeModal()">取消</button>' +
                '</div>'
              );

              const drop = document.getElementById('custom-img-drop');
              const confirm = document.getElementById('custom-img-confirm');
              if (drop) {
                drop.addEventListener('click', () => { picker.value = ''; picker.click(); });
                ['dragenter', 'dragover'].forEach((evt) => drop.addEventListener(evt, (e) => {
                  e.preventDefault();
                  drop.classList.add('is-over');
                }));
                ['dragleave', 'dragend'].forEach((evt) => drop.addEventListener(evt, () => drop.classList.remove('is-over')));
                drop.addEventListener('drop', (e) => {
                  e.preventDefault();
                  drop.classList.remove('is-over');
                  const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
                  if (file) uploadCustomImage(file, kind, { previewOnly: true });
                  else showToast('未接收到文件', 'warn');
                });
              }
              if (confirm) confirm.addEventListener('click', usePickedCustomImage);
            }

            // 弹窗里那颗「使用」: 把已经传好的 URL 真的换上 (传完不自动换, 就是等这一下)
            async function usePickedCustomImage() {
              if (!pendingCustomImage) return;
              const { kind, url } = pendingCustomImage;
              pendingCustomImage = null;
              if (kind === 'profile') customState.bg_image = url;
              else customState.chat_bg = url;
              renderCustomState();
              applyBackgrounds();   // 缩略图之外, 页面/聊天背景也要立刻换
              closeModal();
              await saveCustomFields();
              showProfileStatus('背景已更新', 'ok');
            }

            async function uploadCustomImage(file, kind, options) {
              const previewOnly = !!(options && options.previewOnly);
              if (file.size > 5 * 1024 * 1024) {
                showProfileStatus('背景图不能超过 5 MB', 'warn');
                return;
              }
              const meta = document.getElementById('custom-img-meta');
              const dropZone = document.getElementById('custom-img-drop');
              const busyBox = document.getElementById('custom-img-busy');
              const busyText = document.getElementById('custom-img-busy-text');
              const info = (file.name || '图片') + ' · ' + formatFileSize(file.size);
              /* 上传中必须有看得见的反馈 (以前只有一行藏在 hidden 里的字, 看起来就是没反应)。
                    桌面这条路不能弹 showBusyModal —— 它会把上传弹窗的内容整个换掉, 预览图和「使用」就都没了;
                    所以改成在上传弹窗内部换成「上传中…」, 并把拖放区收起 (传完之前不能再选文件) */
              if (previewOnly) {
                if (dropZone) dropZone.hidden = true;
                if (busyBox) busyBox.hidden = false;
                if (busyText) busyText.textContent = info + ' · 上传中…';
              }
              const busy = previewOnly ? null : showForaineToast({ text: I18N.t('foraine-toast.loading'), block: true });
              try {
                const form = new FormData();
                form.append('file', file);
                form.append('kind', kind); // profile | chat → 服务端存成 img/<用户名>/profile-image.*
                const res = await fetch('/api/image', { method: 'POST', body: form });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || '上传失败');

                if (previewOnly) {
                  /* 传完就只预览: 拖放区收起 (它已经没用了), 露出预览 + 「使用」——
                        真的要换上得用户自己点那一下 */
                  pendingCustomImage = { kind, url: data.url, name: file.name || '' };
                  const img = document.getElementById('custom-img-picked-img');
                  const box = document.getElementById('custom-img-picked');
                  const drop = document.getElementById('custom-img-drop');
                  const btn = document.getElementById('custom-img-confirm');
                  if (busyBox) busyBox.hidden = true;
                  if (img) img.src = data.url;
                  if (box) box.hidden = false;
                  if (drop) drop.hidden = true;
                  if (meta) meta.textContent = (file.name || '图片') + ' · ' + formatFileSize(file.size) + ' · 已上传，点「使用」换上';
                  if (btn) btn.disabled = false;
                  return;
                }

                if (kind === 'profile') customState.bg_image = data.url;
                else customState.chat_bg = data.url;
                renderCustomState();
                await saveCustomFields(); // 上传完立刻存 (不靠下面那个保存按钮)
              } catch (err) {
                // 失败要把拖放区放回来, 不然弹窗里只剩一块「上传中…」
                if (previewOnly) {
                  if (busyBox) busyBox.hidden = true;
                  if (dropZone) dropZone.hidden = false;
                }
                showProfileStatus(err.message, 'error');
              } finally {
                if (busy) busy.close();
              }
            }

            function removeCustomImage(kind) {
              if (kind === 'profile') {
                customState.bg_image = '';
                customState.bg_blur = 0;
              } else {
                customState.chat_bg = '';
                customState.chat_blur = 0;
              }
              renderCustomState();
              saveCustomFields(); // 移除也是立刻生效
            }

            // 位置栏的「定位」: 浏览器经纬度 → 服务端转 Nominatim → 填回输入框
            function locateMe() {
              const btn = document.getElementById('profile-locate');
              const input = document.getElementById('extra-location');
              if (!navigator.geolocation) {
                showProfileStatus('这个浏览器不支持定位', 'warn');
                return;
              }
              const label = btn.textContent;
              btn.disabled = true;
              btn.dataset.i18n = 'opt.locate.processing'
              btn.textContent = '定位中…';
              const done = () => {
                btn.disabled = false;
                btn.textContent = label;
              };
              navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                  const res = await fetch('/api/geo/reverse?lat=' + pos.coords.latitude
                    + '&lon=' + pos.coords.longitude, { cache: 'no-store' });
                  const data = await res.json().catch(() => ({}));
                  if (!res.ok) throw new Error(data.error || '定位失败');
                  input.value = data.label;
                  refreshProfileSaveState();
                  showProfileStatus(I18N.t('target.filledIn', '已填入：{value}', { value: data.label }), 'ok');
                } catch (err) {
                  showProfileStatus(err.message, 'error');
                } finally {
                  done();
                }
              }, () => {
                done();
                showProfileStatus(I18N.t('locate.error-Unable2Get'), 'error');
              }, { timeout: 10000, maximumAge: 600000 });
            }

            function bindProfileForm() {
              const ids = ['nickname-input', 'bio-input', 'other-input', 'email-input']
                .concat(OTHER_FIELDS.map((f) => f.el));
              ids.forEach((id) => {
                document.getElementById(id).addEventListener('input', refreshProfileSaveState);
              });
              // 邮箱框一改动, 「验证邮箱」按钮的显隐也要跟着变 (合规才出现)
              document.getElementById('email-input').addEventListener('input', () => renderEmailAction(currentUser));
              ['bio-input', 'other-input'].forEach((id) => {
                const elm = document.getElementById(id);
                elm.addEventListener('input', () => autoGrow(elm));
                autoGrow(elm);
              });

              // 个性化: 两张卡片的模糊度滑条 + 共用的文件选择器
              ['profile', 'chat'].forEach((kind) => {
                const slider = document.getElementById('blur-' + kind);
                if (!slider) return;
                // 拖的时候只做预览 (缩略图 + 真背景), 松手 (change) 才发请求
                slider.addEventListener('input', () => {
                  const n = Math.max(0, Math.min(100, parseInt(slider.value, 10) || 0));
                  if (kind === 'profile') customState.bg_blur = n;
                  else customState.chat_blur = n;
                  // 只更新这两个小字与预览, 不整块重画 (拖滑条时重建 DOM 会掉手感)
                  const value = document.getElementById('blur-' + kind + '-value');
                  if (value) value.textContent = String(n);
                  slider.style.setProperty('--fill', n + '%');
                  const thumb = document.querySelector('#thumb-' + kind + '-bg img');
                  if (thumb) thumb.style.filter = 'blur(' + blurPx(n) + ')';
                  applyBackgrounds(true); // true = 别量高度, 拖的时候要跟手
                });
                slider.addEventListener('change', () => saveCustomFields(true));
              });
              const picker = document.getElementById('custom-image-file');
              if (picker) {
                picker.addEventListener('change', () => {
                  const file = picker.files && picker.files[0];
                  /* 意图读完不能清 —— 上传没完之前又选了一次文件时, 第二次 change 就查不到意图,
                        掉进「传完直接换上」那条老路 (连预览都跳过)。
                        它由 pickCustomImage 在每次开弹窗时重写, 不在这里清 */
                  const intent = customImageIntent;
                  if (!file) return;   // 对话框被取消: 什么都不做 (以前这里会误清预览标记)
                  const kind = (intent && intent.kind) || (picker.dataset.kind === 'chat' ? 'chat' : 'profile');
                  // 兜底: 没有意图时也按「桌面=先预览 / 触屏=传完直接换上」走, 不走老路
                  const previewOnly = intent ? !!intent.preview : !PROFILE_TOUCH_ONLY;
                  uploadCustomImage(file, kind, { previewOnly });
                });
              }
            }

            // Ctrl/Cmd + S 保存修改: 没改动(按钮还是禁用的)就什么也不做,
            // 有改动就顶掉浏览器自带的「保存网页」(不再弹下载框)
            function bindProfileShortcuts() {
              document.addEventListener('keydown', (e) => {
                if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
                if (e.key.toLowerCase() !== 's') return;
                e.preventDefault();
                const save = document.getElementById('profile-save');
                if (save && !save.disabled) saveProfileChanges();
              });
            }

            async function saveProfileChanges() {
              // 点下去先挂一块「保存进度...」牌子 (1 秒), 不封屏幕
              showForaineToast({ text: I18N.t('foraine-toast.saveProgress'), duration: 1500 });
              const form = readProfileForm();
              if (!form.nickname) {
                showProfileStatus(I18N.t('profile.pf.nickname.toast-error-empty-nickname'), 'error');
                return false;
              }
              // 没绑邮箱的人直接点「保存更改」也要过这一关 (服务端也会验, 但别让人白跑一趟)
              if (form.email && !isValidEmailAddress(form.email)) {
                showProfileStatus(I18N.t('email.error-NameNotSuitable'), 'error');
                document.getElementById('email-input').focus();
                return false;
              }
              const payload = {
                nickname: form.nickname,
                bio: form.bio,
                other: composeOther(form)
              };
              /* 邮箱平时不提交 —— 有邮箱时它是只读的, 换邮箱只能走「换绑」
                    (服务端 handleSaveProfile 会把「想改已存在的邮箱」的请求拒掉)。
                    只有一种情况要带上它: 从来没绑过邮箱 (form.email 有值) */
              if (form.email) payload.email = form.email;
              // 成功不弹文字提示 (提示交给按钮自己的「已保存」)
              if (!(await saveProfileField(payload, ''))) return false;

              // 绑定邮箱
              if (form.email && currentUser) {
                currentUser.email = form.email;
                currentUser.email_verified = false;
                applyEmailState(currentUser);
                showToast(I18N.t('toast.email.ok-bindingCompleted'), 'ok');
                showForaineToast({ text: I18N.t('foraine-toast.foraineWouldRemember'), duration: 3000 });
              }

              profileBaseline = form; // 新基线: 按钮回到禁用
              resetSaveButton();
              refreshProfileSaveState();
              showSavedState();
              document.getElementById('profile-nickname').textContent = form.nickname;
              document.getElementById('profile-bio').textContent = form.bio || '无，所以无穷';
              renderProfileSide(currentUser);
              renderEmailAction(currentUser);
              return true;
            }

            /* 账号邮箱 (验证 / 换绑)
                  邮箱存在 users.email。规矩: 注册时必填, 验证前后都不给直接改 (框子一直只读);
                  想换就走「换绑」: 验密码 → 旧邮箱收确认信 → 点开链接回到本页 → 立刻填新邮箱才真的换掉。
                  为什么这么严: 邮箱是身份凭证 (注销要验证码、改密要收链接), 谁能随手换邮箱谁就能注销别人的号 */
            function emailIsVerified(user) {
              return Boolean(user && user.email_verified && user.email);
            }

            // 站点还没配 Resend 密钥: 先告诉用户, 别让人白输一次密码
            function mailServiceReady() {
              if (currentUser && currentUser.mail_ready === false) {
                showProfileStatus(I18N.t('email.error-NoService'), 'error');
                return false;
              }
              return true;
            }

            function applyEmailState(user) {
              /* 从没绑过邮箱 (users.email 为空) 的账号, 框是可编辑的, 面板会催他填 + 保存即绑定
                    (服务端只允许这种一次性绑定); 一旦有值就一律只读 —— 换邮箱只有「换绑」一条路 */
              const input = document.getElementById('email-input');
              const email = (user && user.email) || '';
              input.readOnly = !!email;
              input.classList.toggle('is-locked', !!email);
              input.title = !email
                ? '填好邮箱后点「保存更改」——一旦保存就不可再更改'
                : (emailIsVerified(user)
                  ? '已验证的邮箱不能直接更改，请「换绑邮箱」'
                  : '邮箱在验证前不能修改，请「验证邮箱」');
              input.value = email;
              renderEmailNotice(user);
            }

            /* 邮箱提示面板: 没绑 → 红边 + [绑定邮箱]; 绑了没验证 → 黄边 + [验证邮箱]; 已验证 → 整块收起。
                  面板里那两句话是定死的文案, 别改写 */
            function renderEmailNotice(user) {
              const box = document.getElementById('email-notice');
              if (!box) return;
              const btn = document.getElementById('email-notice-btn');
              const text = document.getElementById('email-notice-text');
              const email = (user && user.email) || '';
              if (emailIsVerified(user)) { box.hidden = true; return; }
              box.hidden = false;
              const fresh = !email;   // 从来没绑过
              box.classList.toggle('is-danger', fresh);
              box.classList.toggle('is-warn', !fresh);
              if (fresh) {
                btn.dataset.i18n = 'opt.bind'
                btn.onclick = () => {
                  const input = document.getElementById('email-input');
                  if (!input) return;
                  const value = input.value.trim();
                  if (!value) {
                    showProfileStatus(I18N.t('email.warn-EmptyAddress'), 'warn');
                    input.focus();
                    return;
                  }
                  if (!isValidEmailAddress(value)) {
                    showProfileStatus(I18N.t('email.error-NameNotSuitable'), 'error');
                    input.focus();
                    return;
                  }
                  saveProfileChanges();
                };
                text.dataset.i18n = 'profile.pf.email.notice.unbound';
              } else {
                btn.dataset.i18n = 'opt.verify'
                btn.onclick = () => verifyEmail();
                text.dataset.i18n = 'profile.pf.email.notice.unverified';
              }
            }


            /* 注销按钮什么时候该灰: 已经提交过注销 / 取消注销还在 7 天冷静期里 */
            function renderAccountGates(user) {
              const btn = document.getElementById('account-delete');
              if (!btn) return;
              const pending = user && user.pending_delete;
              const cooldown = user && user.delete_cooldown;
              btn.disabled = !!(pending || cooldown);
              btn.title = pending
                ? I18N.t('hint.accountAlreadyInDeactivated')
                : (cooldown ? I18N.t('hint.accountDeletionRequestOverflow', {value: cooldown.daysLeft}) : '');
            }

            function renderEmailAction(user) {
              // 两个动作按钮互斥: 已验证 → 「换绑邮箱」; 未验证 → 有邮箱就能「验证邮箱」。
              const verifyBtn = document.getElementById('email-verify');
              const rebindBtn = document.getElementById('email-rebind');
              if (!verifyBtn || !rebindBtn) return;

              if (emailIsVerified(user)) {
                verifyBtn.hidden = true;
                rebindBtn.hidden = false;
                return;
              }
              rebindBtn.hidden = true;
              verifyBtn.hidden = !isValidEmailAddress(currentEmailInput());
            }

            function currentEmailInput() {
              // 邮箱框永远是只读的, 所以“当前邮箱”就是服务端给的那个
              const input = document.getElementById('email-input');
              return (input && input.value.trim()) || (currentUser && currentUser.email) || '';
            }

            // 邮箱格式校验现在是 core.js 里的 isValidEmailAddress() (注册页 / 个人页共用一份)
            // —— 与 worker.js 的 isValidEmail 保持一致, 别在这里再写一份

            async function verifyEmail() {
              if (!currentUser) return;
              if (!mailServiceReady()) return;
              const email = currentUser.email || '';
              if (!email) {
                return;
              }
              try {
                const res = await apiPost('/api/email/verify', {});
                // 有效期由服务端给 (链接能活多久只有它知道)
                showProfileStatus(I18N.t('target.emailSent', {
                  target: (res && res.email) || email,
                  value: (res && res.ttl_minutes) || 30
                }), 'ok');
              } catch (error) {
                showProfileStatus(error.message, 'error');
              }
            }

            /* 换绑邮箱 */
            async function rebindEmailStart() {
              if (!currentUser) return;
              if (!mailServiceReady()) return;
              const go = await confirmAction({
                title: I18N.t('ops.changeEmail'),
                message: I18N.t('ops.changeEmail.a-ctn'),
                confirmText: I18N.t('opt.continue'),
                warning: ''
              });
              if (!go) return;

              const busy = showForaineToast({ text: I18N.t('foraine-toast.loading'), block: true });
              try {
                await apiPost('/api/email/unbind', {});
              } catch (error) {
                showProfileStatus(error.message || I18N.t('toast.email.error-Failed2SentEmail'), 'error');
                return;
              } finally {
                busy.close();
              }
              showProfileStatus(I18N.t('target.emailSent', {target: currentUser.email, value: 5}), 'ok');

              let pass = '';
              const verified = await confirmAction({
                title: I18N.t('opt.verify'),
                message: I18N.t('ops.changeEmail.b-ctn', {value: 6}),
                confirmText: I18N.t('opt.continue'),
                warning: '',
                lock: true,
                fields: [{ name: 'code', placeholder: I18N.t('value.digit', {value:6}), required: true, maxlength: 6 }],
                onConfirm: async (value, api) => {
                  const typed = String(value.code || '').trim();
                  if (!/^\d{6}$/.test(typed)) {
                    api.setError(I18N.t('toast.error-WrongCode'));
                    return false;
                  }
                  try {
                    const r = await apiPost('/api/email/unbind/verify', { code: typed });
                    pass = r.pass || '';
                  } catch (error) {
                    api.setError(error.message || I18N.t('toast.error-WrongCode'));
                    return false;
                  }
                  return true;
                }
              });
              if (!verified || !pass) return;
              await openRebindDialog(pass);
            }

            async function openRebindDialog(pass) {
              if (!pass) return;
              if (!currentUser) return;

              let next = '';
              const ok = await confirmAction({
                title: I18N.t('ops.changeEmail'),
                message: I18N.t('ops.changeEmail.c-ctn'),
                confirmText: I18N.t('opt.continue'),
                warning: '',
                lock: true,
                fields: [
                  { name: 'email', placeholder: 'your-email@example.com', maxlength: 120, required: true }
                ],
                onConfirm: async (value, api) => {
                  const email = String(value.email || '').trim();
                  if (!isValidEmailAddress(email)) {
                    api.setError(I18N.t('email.error-NameNotSuitable'));
                    return false;
                  }
                  try {
                    const sent = await apiPost('/api/email/rebind', { pass, email });
                    next = sent.email || email;
                  } catch (error) {
                    api.setError(error.message || I18N.t('hint.operation.failed'));
                    return false;
                  }
                  return true;
                }
              });
              if (!ok) return;
            
              const done = await confirmAction({
                title: I18N.t('opt.verify'),
                message: I18N.t('target.emailSent', {target: next, value: 10}),
                confirmText: I18N.t('opt.confirm'),
                warning: '',
                lock: true,
                fields: [
                  { name: 'code', placeholder: I18N.t('value.digit', {value:6}), required: true, maxlength: 6 }
                ],
                onConfirm: async (value, api) => {
                  const typed = String(value.code || '').trim();
                  if (!/^\d{6}$/.test(typed)) {
                    api.setError(I18N.t('toast.error-WrongCode'));
                    return false;
                  }
                  try {
                    await apiPost('/api/email/rebind/confirm', { code: typed });
                  } catch (error) {
                    api.setError(error.message || I18N.t('toast.error-WrongCode'));
                    return false;
                  }
                  return true;
                }
              });
              if (!done) return;

              showProfileStatus(I18N.t('toast.email.ok-reboundSuccessful'), 'ok');
              showForaineToast({ text: I18N.t('foraine-toast.foraineWouldRemember'), duration: 3000 });
              try {
                currentUser = await getCurrentUser();
                fillProfileForm(currentUser);
                renderProfileSide(currentUser);
                applyEmailState(currentUser);
                renderEmailAction(currentUser);
              } catch (error) { }
            }

            /* 重置密码 */
            async function resetPassword() {
              if (!currentUser) return;
              const go = await confirmAction({
                title: I18N.t('account.resetPassword'),
                message: I18N.t('ops.resetPassword.a-ctn'),
                confirmText: I18N.t('opt.continue'),
                warning: ''
              });
              if (!go) return;

              const busy = showForaineToast({ text: I18N.t('foraine-toast.loading'), block: true });
              let busyGone = false;
              const dropBusy = () => { if (!busyGone) { busyGone = true; busy.close(); } };
              let verified;
              try {
                verified = await window.verifyIdentity({ methods: ['totp', 'email'], lock: true, leftCancel: true, beforeWait: dropBusy });
              } finally {
                dropBusy();
              }
              if (!verified || !verified.pass) return;

              const done = await confirmAction({
                title: I18N.t('account.resetPassword'),
                message: I18N.t('ops.resetPassword.b-ctn'),
                confirmText: I18N.t('opt.set'),
                warning: '',
                lock: true,
                fields: [
                  { name: 'password', type: 'password', placeholder: I18N.t('label.newPassword'), required: true, maxlength: 200 },
                  { name: 'password2', type: 'password', placeholder: I18N.t('label.confirmPassword'), required: true, maxlength: 200 }
                ],
                onConfirm: async (values, api) => {
                  if (String(values.password || '').length < 6) {
                    api.setError(I18N.t('toast.resetPassword.warn-AtLeastChar', {value:6}));
                    return false;
                  }
                  if (values.password !== values.password2) {
                    api.setError(I18N.t('toast.resetPassword.error-DoesNotMatch'));
                    return false;
                  }
                  try {
                    await apiPost('/api/password/set', { pass: verified.pass, password: values.password });
                  } catch (error) {
                    api.setError(error.message || I18N.t('hint.operation.failed'));
                    return false;
                  }
                  return true;
                }
              });
              if (!done) return;
              showProfileStatus(I18N.t('toast.resetPassword.success'), 'ok');
              showForaineToast({ text: I18N.t('foraine-toast.foraineWouldRemember'), duration: 3000 });
            }
            
            /* 退出登录 */
            async function logout() {
              const yes = await confirmAction({
                title: I18N.t('account.logOut'),
                message: I18N.t('ops.logOut.ctn'),
                confirmText: I18N.t('opt.confirm'),
                danger: true,
                warning: ''
              });
              if (!yes) return;
              await fetch('/api/logout', { method: 'POST', cache: 'no-store' }).catch(() => {});
              try { localStorage.removeItem('foraine.lang'); } catch (err) {}
              pageTransitionTo('/index.html');
            }

            /* 删除账户 */
            async function deleteAccount() {
              if (!currentUser) return;
              if (currentUser.pending_delete) {
                showProfileStatus(I18N.t('hint.accountAlreadyInDeactivated'), 'warn');
                return;
              }
              if (currentUser.delete_cooldown) {
                showProfileStatus(I18N.t('hint.accountDeletionRequestOverflow', {value: currentUser.delete_cooldown.daysLeft}), 'warn');
                return;
              }
              if (!emailIsVerified(currentUser)) {
                showProfileStatus(I18N.t('toast.deleteAccount.warn-emailVerificationNeeded'), 'warn');
                return;
              }

              // 注销框 #1
              const go = await confirmAction({
                title: I18N.t('account.deleteAccount'),
                message: I18N.t('ops.deleteAccount.a-ctn'),
                warning: '',
                confirmText: I18N.t('opt.continue'),
                danger: true
              });
              if (!go) return;

              // 调用VerifyIdentity
              const busy = showForaineToast({ text: I18N.t('foraine-toast.loading'), block: true });
              let busyGone = false;
              const dropBusy = () => { if (!busyGone) { busyGone = true; busy.close(); } };
              let verified;
              try {
                verified = await window.verifyIdentity({ methods: ['totp', 'email'], lock: true, leftCancel: true, beforeWait: dropBusy });
              } finally {
                dropBusy();
              }
              if (!verified || !verified.pass) return;

              // 注销框 #2: 最终确认
              const yes = await confirmAction({
                title: I18N.t('ops.deleteAccount.b-title'),
                message: I18N.t('ops.deleteAccount.b-ctn'),
                warning: '',
                lock: true,
                requireText: currentUser.username,
                requireTextIgnoreCase: true,
                actions: [
                  { id: 'stay', text: I18N.t('label.stay') },
                  { id: 'leave', text: I18N.t('label.MadeMyMind'), danger: true }
                ]
              });
              if (!yes || yes.id !== 'leave') return;

              let deleteAt = 0;
              const busyDelete = showForaineToast({ text: I18N.t('foraine-toast.loading'), block: true });
              try {
                const result = await apiPost('/api/account/delete', {
                  confirm: currentUser.username,
                  pass: verified.pass
                });
                deleteAt = result.delete_at || (Date.now() + 7 * 86400000);
              } catch (error) {
                showProfileStatus(error.message, 'error');
                return;
              } finally {
                busyDelete.close();
              }

              // 注销框 #3: 再见宣言~
              await confirmAction({
                title: I18N.t('label.goodble') + '!',
                message: I18N.t('ops.deleteAccount.c-ctn'),
                warning: '',
                actions: [{ id: 'ok', text: I18N.t('opt.confirm') }]
              });

              try {
                currentUser = await getCurrentUser();
                renderPendingBanner(currentUser);
                renderAccountGates(currentUser);
              } catch (error) {}
              showProfileStatus(I18N.t('toast.deleteAccout.ok-requestSubmitted', {value: formatDate(deleteAt)}), 'warn');
              showForaineToast({ text: I18N.t('foraine-toast.foraineWouldRemember'), duration: 3000 });
            }

            /* 注销提示横幅 */
            function renderPendingBanner(user) {
              const box = document.getElementById('pending-banner');
              if (!box) return;
              const pending = user && user.pending_delete;
              if (!pending) {
                box.hidden = true;
                return;
              }
              box.innerHTML = '';
              box.appendChild(el('p', 'pending-banner-title', I18N.t('notice.deleteAccount.title', {value: pending.daysLeft})));
              box.appendChild(el('p', 'pending-banner-text',
                I18N.t('notice.deleteAccount.ctn', {value: formatDate(pending.deleteAt)})));
              const row = el('div', 'pending-banner-actions');
              const btn = el('button', 'btn-acrylic', I18N.t('label.cancelAccountDeletion'));
              btn.type = 'button';
              btn.onclick = cancelDeletion;
              row.appendChild(btn);
              box.appendChild(row);
              box.hidden = false;
            }
            
            /* 取消注销 */
            async function cancelDeletion() {
              const ok = await confirmAction({
                title: I18N.t('label.cancelAccountDeletion'),
                message: I18N.t('ops.cancelAccountDeletion.ctn'),
                confirmText: I18N.t('label.cancelAccountDeletion')
              });
              if (!ok) return;
              try {
                await withLoading(() => apiPost('/api/account/cancel-deletion', {}));
                currentUser = await getCurrentUser();
                renderPendingBanner(currentUser);
                renderAccountGates(currentUser);
                showProfileStatus(I18N.t('toast.cancelAccountDeletion.ok-confirmed'), 'ok');
              } catch (error) {
                showProfileStatus(error.message, 'error');
              }
            }
        </script>
    </body>
</html>
