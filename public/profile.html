                message: '解除后 ' + (user.nickname || user.username) + ' 可以重新发布文章，对方会收到一封站内信。',
                confirmText: '解除封禁',
                onConfirm: async () => {
                  await apiPost('/api/moderation/unban', { username: user.username });
                  showToast('已解除封禁', 'ok');
                  reloadMembers();
                }
              });
            }

            async function deleteMember(user) {
              // 站长的动作: 两步确认 —— 先说明后果, 再要求把用户名打一遍
              await confirmAction({
                title: '删除用户 ' + user.username,
                message: '该账号与其全部文章都会被删除，且无法恢复。\n' +
                  '文章会从站内消失（作者显示为「已注销」），账号本身彻底清空。',
                confirmText: '删除用户',
                danger: true,
                requireText: user.username,
                warning: '',
                onConfirm: async () => {
                  await apiPost('/api/admin/user/delete', { username: user.username });
                  showToast('已删除 ' + user.username, 'ok');
                  reloadMembers();
                }
              });
            }

            /* 关注 (追随者): 左侧「N 名追随者」+ 看别人主页时的「关注」按钮 + 连携星点右键菜单。
                  计数公开, 「我关注了谁」只有自己看得到 (服务端按登录态算) */
            let followState = null;
            let followTarget = ''; // 当前这个主页是谁的

            async function loadFollowState(username) {
              followTarget = username || '';
              if (!followTarget) return;
              try {
                const response = await fetch('/api/follow?username=' + encodeURIComponent(followTarget), { cache: 'no-store' });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '加载失败');
                applyFollowState(data);
              } catch (error) {
                // 追随者数拿不到就不显示这一行, 不弹错误 (它只是个锦上添花的信息)
              }
            }

            function applyFollowState(data) {
              followState = data || { followers: 0, following: 0, is_following: false, is_self: true };
              const stat = document.getElementById('profile-stat-followers');
              if (stat) {
                stat.innerHTML = '';
                const holder = document.createElement('span');
                holder.innerHTML = ICONS.user;
                if (holder.firstChild) stat.appendChild(holder.firstChild);
                stat.appendChild(el('span', null, (followState.followers || 0) + ' 名追随者'));
                stat.hidden = false;
              }
              renderFollowActions();
            }

            function renderFollowActions() {
              const box = document.getElementById('profile-actions');
              if (!box) return;
              box.innerHTML = '';
              // 只有「看别人的公开主页」才需要: 自己的主页有编辑表单, 访客什么都不给
              if (!isPublicView || !followState || followState.is_self) {
                box.hidden = true;
                return;
              }
              const followBtn = el('button',
                followState.is_following ? 'btn-acrylic' : 'btn',
                followState.is_following ? '已关注' : '关注');
              followBtn.onclick = () => toggleFollow(followTarget, !(followState && followState.is_following));
              box.appendChild(followBtn);

              const chatBtn = el('button', 'btn-acrylic', '私聊');
              chatBtn.onclick = () => openChat({
                username: followTarget,
                nickname: document.getElementById('profile-nickname').textContent || followTarget
              });
              box.appendChild(chatBtn);
              box.hidden = false;
            }

            async function toggleFollow(username, wantFollow) {
              if (!currentUser) {
                showToast('登录后才能关注', 'warn');
                return;
              }
              try {
                const data = await apiPost('/api/follow', { username, follow: !!wantFollow });
                // 主页上的按钮 / 计数
                if (username === followTarget) applyFollowState(data);
                // 连携星点里那张卡片上的「已关注」标记
                const cached = memberList.find((u) => u.username === username);
                if (cached) {
                  cached.is_following = data.is_following;
                  renderMemberGrid();
                }
                // 三元的每一边都是一个完整句子 → 各给一个 key, 别让译文去理解条件
                showToast(data.is_following
                  ? I18N.t('follow.on', '已关注 @{name}', { name: username })
                  : I18N.t('follow.off', '已取消关注 @{name}', { name: username }), 'ok');
              } catch (error) {
                showToast(error.message, 'error');
              }
            }

            /* 私聊 (保留聊天记录的模态框): 一个弹窗 = 一段两人对话, 打开时拉最近 200 条, 打开期间每 5 秒轮询一次。
                  轮询靠「#chat-body 还在不在」自己收尾 —— 弹窗可以用遮罩 / × 关掉, 没有统一的关闭回调 */
            const CHAT_POLL_MS = 5000;
            let chatPeer = null;
            let chatTimer = null;
            let chatLastId = 0;

            function openChat(user) {
              if (!currentUser) {
                showMessage('需要登录<br><br>' +
                  '<button class="btn" onclick="closeModal(); pageTransitionTo(\'/login.html\')">去登录</button>');
                return;
              }
              // 手机端：用专门的私信页 (QQ 那种整屏界面); 桌面端保持弹窗
              if (matchMedia('(max-width: 900px)').matches) {
                pageTransitionTo('/chat/?u=' + encodeURIComponent(user.username));
                return;
              }
              chatPeer = {
                username: user.username,
                nickname: user.nickname || user.username,
                avatar_url: user.avatar_url || DEFAULT_AVATAR
              };
              chatLastId = 0;

              showMessage(
                '<div class="chat-modal">' +
                  '<div class="chat-head">' +
                    '<img class="chat-avatar" alt="" src="' + escapeHtml(chatPeer.avatar_url) + '">' +
                    '<div class="chat-who">' +
                      '<p class="chat-name">' + escapeHtml(chatPeer.nickname) + '</p>' +
                      '<p class="chat-username">@' + escapeHtml(chatPeer.username) + '</p>' +
                    '</div>' +
                    '<button type="button" class="chat-close" onclick="closeChat()" aria-label="关闭" title="关闭">' +
                      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>' +
                    '</button>' +
                  '</div>' +
                  '<div class="chat-body" id="chat-body"></div>' +
                  '<div class="chat-send">' +
                    '<div class="chat-send-box">' +
                      '<textarea id="chat-input" rows="1" maxlength="600" placeholder="说点什么…"></textarea>' +
                      '<button type="button" class="chat-attach-btn" onclick="openChatAttach()" title="上传文件 / 图片" aria-label="上传文件或图片">' +
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>' +
                      '</button>' +
                      '<button type="button" class="btn" id="chat-send-btn" onclick="sendChat()">发送</button>' +
                    '</div>' +
                  '</div>' +
                '</div>'
              );

              const input = document.getElementById('chat-input');
              if (input) {
                hardenField(input);
                // 弹窗里的私聊输入框也跟着内容长高 (在底部 → 向上长), 与私信页一致
                bindAutoGrow(input, 5);
                input.addEventListener('keydown', (event) => {
                  if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendChat();
                  }
                });
                // 粘贴图片 / 文件 (与私信页同一套, 实体在 ui.js)
                input.addEventListener('paste', (event) => {
                  const items = (event.clipboardData && event.clipboardData.items) || [];
                  for (let i = 0; i < items.length; i += 1) {
                    if (items[i].kind !== 'file') continue;
                    const file = items[i].getAsFile();
                    if (!file) continue;
                    event.preventDefault();
                    chatAttachTake(file);
                    return;
                  }
                });
                input.focus();
              }

              refreshChat(true);
              clearInterval(chatTimer);
              chatTimer = setInterval(() => {
                if (!document.getElementById('chat-body')) { // 弹窗已关
                  clearInterval(chatTimer);
                  chatTimer = null;
                  return;
                }
                refreshChat(false);
              }, CHAT_POLL_MS);
            }

            function closeChat() {
              clearInterval(chatTimer);
              chatTimer = null;
              chatPeer = null;
              closeModal();
            }

            async function refreshChat(force) {
              if (!chatPeer || !document.getElementById('chat-body')) return;
              try {
                const response = await fetch('/api/chat?username=' + encodeURIComponent(chatPeer.username), { cache: 'no-store' });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '加载失败');

                const box = document.getElementById('chat-body');
                if (!box) return; // 请求期间被关掉了
                // 本地删掉的那些（右键 → 删除）不再画出来（服务端不知道这件事）;
                // 同时按 cid / 服务端 id 去重: 自己刚发的那条早就乐观上屏了
                const messages = (data.messages || []).filter((m) => !isChatMessageHidden(m.id)).filter((m) => {
                  const existing = findChatRow(m);
                  if (existing) { patchChatRow(existing, m); return false; }
                  return true;
                });
                const newest = messages.length ? messages[messages.length - 1].id : 0;
                if (!force && newest === chatLastId) return; // 没新消息就不动 DOM (否则滚动位置会被弹回)

                const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 48;
                renderChatMessages(messages);
                chatLastId = newest;
                if (force || atBottom) box.scrollTop = box.scrollHeight;
              } catch (error) {
                showToast(error.message, 'error');
              }
            }

            function chatMyAvatar() {
              return (currentUser && currentUser.avatar_url) || DEFAULT_AVATAR;
            }

            /* 一条消息 = 头像 + (气泡 + 时间); options 可覆盖 mine / isNew / body (乐观那条还没有服务端数据)。
                  内容渲染走 ui.js 的 fillChatBubble (与私信页共用) */
            function chatMessageRow(data, options) {
              const opts = options || {};
              const mine = opts.mine !== undefined ? opts.mine : !!data.mine;
              const row = el('div', 'chat-msg' + (mine ? ' is-mine' : '') + (opts.isNew ? ' is-new' : ''));
              /* 右键菜单（复制 / 引用 / 删除 / 撤回）靠行上这几个属性 —— 两个宿主写法一致,
                    具体用法见 ui.js 的 document 委派 */
              if (data.id) row.dataset.id = String(data.id);
              if (data.created_at) row.dataset.at = String(data.created_at);
              if (data.cid || opts.cid) row.dataset.cid = String(data.cid || opts.cid);
              row.dataset.body = String(opts.body !== undefined ? opts.body : (data.body || ''));
              row.dataset.who = mine ? '我' : ((chatPeer && chatPeer.nickname) || '');

              const img = document.createElement('img');
              img.className = 'chat-msg-avatar';
              img.alt = '';
              img.src = mine ? chatMyAvatar() : ((chatPeer && chatPeer.avatar_url) || DEFAULT_AVATAR);
              img.onerror = () => { img.onerror = null; img.src = DEFAULT_AVATAR; };
              row.appendChild(img);

              const main = el('div', 'chat-msg-main');
              const bubble = el('span', 'chat-bubble');
              fillChatBubble(bubble, opts.body !== undefined ? opts.body : data.body);
              main.appendChild(bubble);
              main.appendChild(el('span', 'chat-time', formatChatTime(data.created_at)));
              row.appendChild(main);
              return row;
            }

            function renderChatMessages(messages) {
              const box = document.getElementById('chat-body');
              if (!box) return;
              box.innerHTML = '';
              if (!messages.length) {
                box.appendChild(el('p', 'chat-empty', ''));
                return;
              }
              messages.forEach((m) => { box.appendChild(chatMessageRow(m)); });
            }

            /* 弹窗里的附件位: 点链接按钮弹模态框 ([上传][选择上传的类型] 左右两个虚线框, 左侧文件 / 右侧图片);
                  粘贴也走同一路 (chatAttachTake) */
            const chatAttachState = { att: null };

            function chatSendBox() {
              return document.querySelector('.chat-modal .chat-send-box');
            }

            function renderChatAttachChip() {
              renderChatAttach(chatSendBox(), chatAttachState.att, () => chatAttachClear(true));
            }

            function chatAttachClear(revokePreview) {
              if (revokePreview && chatAttachState.att && chatAttachState.att.previewUrl) {
                URL.revokeObjectURL(chatAttachState.att.previewUrl);
              }
              chatAttachState.att = null;
              renderChatAttachChip();
            }

            function chatAttachTake(file) {
              return setChatAttach(chatAttachState, file, chatSendBox(), renderChatAttachChip);
            }

            // 选完类型就立即发送
            function openChatAttach() {
              openChatAttachPicker((file) => {
                if (chatAttachTake(file)) sendChat();
              });
            }

            /* 乐观发送: 一按下就上屏 + 播放动画, 后台再传附件 / 发消息 (与私信页完全一套行为) */
            function appendSentChat(body, cid) {
              const box = document.getElementById('chat-body');
              if (!box) return null;
              const empty = box.querySelector('.chat-empty');
              if (empty) empty.remove();
              const row = chatMessageRow({ body: body, created_at: Date.now() }, { mine: true, isNew: true, cid: cid });
              box.appendChild(row);
              box.scrollTop = box.scrollHeight;
              return row;
            }

            async function syncSentChat(row, username, text, att, quote, stickerUrl, cid) {
              try {
                let body = text;
                if (att) {
                  // 进度写回气泡里那张卡片的水位层 (见 ui.js 的 setChatFileProgress)
                  const data = await uploadChatAttach(att, (pct) => setChatFileProgress(row, pct));
                  body = chatAttachBody(text, att, data.url, { id: data.id });
                } else if (quote) {
                  body = chatQuoteBody(text, quote);
                }
                const res = await apiPost('/api/chat', { username: username, body: body, cid: cid });
                const msg = res.message || null;
                if (row && row.isConnected) {
                  row.classList.remove('is-new');
                  if (msg) {
                    const bubble = row.querySelector('.chat-bubble');
                    if (bubble) fillChatBubble(bubble, msg.body);
                    const time = row.querySelector('.chat-time');
                    if (time) time.textContent = formatChatStamp(msg.created_at);
                    patchChatRow(row, msg);
                  }
                }
                if (att && att.previewUrl) URL.revokeObjectURL(att.previewUrl);
              } catch (error) {
                if (row && row.isConnected) {
                  row.classList.add('is-failed');
                  failChatFileUpload(row);   // 「上传中」→「上传失败」(水位停在原地)
                  const time = row.querySelector('.chat-time');
                  if (time) time.textContent = '发送失败：' + (error.message || '未知错误');
                }
                showToast(error.message, 'error');
              }
            }

            function sendChat() {
              const input = document.getElementById('chat-input');
              if (!input || !chatPeer) return;
              const box = chatSendBox();
              const text = input.value.trim();
              const att = chatAttachState.att;
              const quote = currentChatQuote(box);
              if (!text && !att && !quote) return;

              const username = chatPeer.username;
              const preview = att ? chatAttachBody(text, att, '', { pending: true })
                : (quote ? chatQuoteBody(text, quote) : text);
              const cid = newChatCid();
              const row = appendSentChat(preview, cid);
              input.value = '';
              autoGrowLines(input, 5);
              if (quote) takeChatQuote(box);
              if (att) chatAttachClear(false); // 别 revoke
              syncSentChat(row, username, text, att, att ? null : quote, null, cid);
            }

            /* 站内信 */
            const NOTICE_KIND = {
              'user':            { icon: 'mail',  label: '私信' },
              'article.delete':  { icon: 'trash', label: '文章被删除' },
              'ban':             { icon: 'lock',  label: '封禁' },
              'unban':           { icon: 'check', label: '解封' },
              'comment.article': { icon: 'chat',  label: '新评论' },
              'comment.reply':   { icon: 'chat',  label: '新回复' },
              'system':          { icon: 'bell',  label: '系统' }
            };
            let noticesLoaded = false;

            // 未读数同时改三处: 页签徽章 / 页签本身的高亮 / 顶部导航的小红点
            function setUnreadBadge(count) {
              const badge = document.getElementById('tab-notice-count');
              if (badge) {
                badge.textContent = String(count || 0);
                badge.hidden = !count;
              }
              const tab = document.getElementById('profile-tab-notices');
              if (tab) tab.classList.toggle('has-unread', !!count);
              if (currentUser) currentUser.unread = count || 0;
              const authBtn = document.querySelector('.site-auth-btn');
              if (authBtn) authBtn.classList.toggle('has-dot', !!count);
              moveTabIndicator(); // 徽章一露出来页签就变宽了
            }

            async function loadNotices() {
              const list = document.getElementById('notice-list');
              list.innerHTML = '';
              list.appendChild(loadingState());
              try {
                const response = await fetch('/api/notices', { cache: 'no-store' });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '加载失败');
                noticesLoaded = true;
                renderNotices(data.notices || []);
                setUnreadBadge(data.unread || 0);
                // 只重播信件本身, 页签与小表头不动
                replayItems(list, '.notice-item');
              } catch (error) {
                noticesLoaded = false;
                list.innerHTML = '';
                list.appendChild(el('p', 'editor-hint', error.message || '加载失败'));
              }
            }

            function renderNotices(notices) {
              const list = document.getElementById('notice-list');
              list.innerHTML = '';

              const unread = notices.filter((n) => !n.read_at).length;
              document.getElementById('notice-hint').textContent = notices.length
                ? (unread ? unread + ' 条未读' : '共 ' + notices.length + ' 条')
                : '';
              document.getElementById('notice-read-all').hidden = !unread;

              if (!notices.length) {
                list.appendChild(emptyState({ icon: 'bell' }));
                return;
              }

              notices.forEach((n) => {
                const kind = NOTICE_KIND[n.kind] || NOTICE_KIND.system;
                const isComment = n.kind === 'comment.article' || n.kind === 'comment.reply';

                /* 评论提醒: 一行就能说完 (谁 · 干了什么 · 说了什么)。点卡片直接去那篇文章;
                      右边原来那个垃圾桶已改成右键菜单里的删除 */
                if (isComment) {
                  const item = el('div', 'notice-item is-comment' + (n.read_at ? '' : ' is-unread'));

                  const face = document.createElement('img');
                  face.className = 'notice-avatar';
                  face.alt = '';
                  face.loading = 'lazy';
                  face.src = n.from_avatar || DEFAULT_AVATAR;
                  face.onerror = () => { face.onerror = null; face.src = DEFAULT_AVATAR; };
                  item.appendChild(face);

                  const line = el('p', 'notice-line');
                  line.appendChild(el('b', 'notice-from', n.from_nickname || n.from_username || '有人'));
                  line.appendChild(document.createTextNode(
                    n.kind === 'comment.reply' ? ' 回复了你的评论 ' : ' 评论了你的文章 '
                  ));
                  line.appendChild(el('i', 'notice-article', '《' + (n.title || '无标题') + '》'));
                  const snippet = String(n.body || '').replace(/\s+/g, ' ').trim();
                  if (snippet) line.appendChild(el('span', 'notice-snippet', '：' + snippet));
                  item.appendChild(line);

                  item.onclick = () => {
                    markNoticeRead(n.id, item);
                    if (n.article_id) pageTransitionTo('/article/?id=' + encodeURIComponent(n.article_id));
                  };
                  bindNoticeMenu(item, n);
                  list.appendChild(item);
                  return;
                }

                const item = el('div', 'notice-item' + (n.read_at ? '' : ' is-unread'));

                const icon = el('span', 'notice-icon');
                icon.innerHTML = ICONS[kind.icon] || ICONS.bell;
                item.appendChild(icon);

                const body = el('div', 'notice-body');
                const title = el('p', 'notice-title', n.title || kind.label);
                title.appendChild(el('span', 'notice-kind', kind.label));
                body.appendChild(title);
                if (n.body) body.appendChild(el('p', 'notice-text', n.body));
                // 发信的人写在时间旁边 (系统通知没有发信人)
                const meta = el('p', 'notice-time');
                if (n.from_username) meta.textContent = '来自 @' + n.from_username + ' · ';
                meta.appendChild(document.createTextNode(formatTime(n.created_at)));
                body.appendChild(meta);
                item.appendChild(body);
                bindNoticeMenu(item, n);

                // 超过两行的信: 卡片上只露两行, 点开在弹窗里看全文
                const lineCount = String(n.body || '').split('\n').length;
                const expandable = lineCount > 2;
                if (expandable) item.classList.add('is-expandable');

                item.onclick = () => {
                  markNoticeRead(n.id, item);
                  if (expandable) showNoticeDetail(n, kind);
                };
                list.appendChild(item);
              });
            }

            /* 删除站内信: 卡片右边的垃圾桶删掉了, 改成右键菜单里的「删除」, 而且删之前要确认 ——
                  垃圾桶太容易误点, 而站内信删了就找不回来了 */
            function bindNoticeMenu(item, n) {
              item.oncontextmenu = (event) => {
                event.preventDefault();
                showContextMenu(event, [{
                  label: '删除',
                  danger: true,
                  icon: CTX_ICONS.trash,
                  onClick: () => deleteNotice(n.id, item)
                }]);
              };
            }

            async function deleteNotice(id, item) {
              const yes = await confirmAction({
                title: '',
                message: '删除后这条站内信就找不回来了，确定删除吗？',
                confirmText: '确定'
              });
              if (!yes) return;
              try {
                const data = await withLoading(() => apiPost('/api/notices/delete', { id }));
                if (item) item.remove();
                showToast('已删除', 'ok');
                if (data && typeof data.unread === 'number') setUnreadBadge(data.unread);
                // 表头那句「N 条未读 / 共 N 条」跟着改 (不重拉列表: 免得整列重播一次入场动画)
                const left = document.querySelectorAll('.notice-item').length;
                if (!left) {
                  loadNotices();
                  return;
                }
                const unreadLeft = document.querySelectorAll('.notice-item.is-unread').length;
                const hint = document.getElementById('notice-hint');
                if (hint) hint.textContent = unreadLeft ? unreadLeft + ' 条未读' : '共 ' + left + ' 条';
                document.getElementById('notice-read-all').hidden = !unreadLeft;
              } catch (error) {
                showToast(error.message, 'error');
              }
            }

            // 支持绑定的第三方账号 (加新渠道只需要往这里加一项)

            const TOTP_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';

            function renderOauthBind(user) {

              const box = document.getElementById('profile-oauth');

              // 动态令牌: 确认过就变灰 (按钮文字保持「动态令牌」)。
              // 图标不能裸用 .btn-acrylic —— 裸 SVG 没人管尺寸, 会撑满整个按钮变成大锁方块;
              // 改用 .btn-gh (与 GitHub 那个同一个类): `.btn-gh svg` 把图标钉在 20×20
              const totpBtn = el('button', 'btn-gh' + (user.totp_enabled ? ' is-bound' : ''));

              if (user.totp_enabled) {

              } else {
                totpBtn.onclick = () => openTotpSetup();
              }
              box.appendChild(totpBtn);

            /* 动态令牌: 每次都现生成一个新密钥 (关掉再打开就是新二维码)。
                  confirmAction 的 messageHtml 是塞进 <p> 里的, 里面只能用行内元素 ——
                  用 <div> 会被浏览器拆开, 所以这里全用 <span> + display:block */
            async function openTotpSetup() {
              /* 「绑定令牌需要邮箱验证」: 邮箱是身份锚点, 没验证过就把令牌绑上, 等于一把没锚的钥匙 */
              if (!emailIsVerified(currentUser)) {
                showProfileStatus('绑定动态令牌前，请先验证邮箱', 'warn');
                return;
              }
              let data;
              // 现生成密钥之后才弹二维码框, 这段等待挂「加载中」
              const busy = showForaineToast({ text: I18N.t('foraine-toast.loading'), block: true });
              try {
                data = await apiPost('/api/totp/setup', {});
              } catch (error) {
                showToast(error.message || '生成失败', 'error');
                return;
              } finally {
                busy.close();
              }
              const svg = qrSvg(data.url, { scale: 5 });
              await confirmAction({
                title: '动态令牌',
                messageHtml:
                  '<span class="totp-note">基于时间的动态令牌是一种二步验证方案<br>'
                  + '其能保证验证秘钥的不可获知性，提供至多60秒的窗口期<br>'
                  + '使用安全软件（如Authenticator）扫描下方的二维码以添加</span>'
                  + '<span class="totp-qr">' + svg + '</span>'
                  + '<span class="totp-manual">扫描不了？手动输入：<code>' + escapeHtml(data.secret) + '</code></span>'
                  + '<span class="totp-warn">二维码只显示这一次，请先妥善保存</span>',
                confirmText: '确认',
                /* 绑定必须**先验一次码**: 以前点确认不带码, 扫错或者没存好的人照样能绑上,
                   那一刻起他就过不了敏感操作的验证了。
                   流程: 填 6 位数字 → liveCheck 只验不改 → 通过了确认键才变亮 →
                   点一下变「确认绑定？」→ 再点才真绑 */
                confirmArmedText: '确认绑定？',
                liveCheckIdle: '在此填写扫描后软件显示的6位数字',
                fields: [{
                  name: 'code', label: '动态令牌', placeholder: '6 位数字',
                  maxlength: 6, required: true
                }],
                liveCheck: async (values) => {
                  const code = String((values && values.code) || '').trim();
                  if (!/^\d{6}$/.test(code)) return { ok: false, hint: '请输入 6 位数字' };
                  try {
                    await apiPost('/api/totp/check', { code });
                    return { ok: true, hint: '验证通过' };
                  } catch (error) {
                    return { ok: false, hint: error.message || '动态令牌错误' };
                  }
                },
                onConfirm: async (values) => {
                  try {
                    await apiPost('/api/totp/enable', { code: String((values && values.code) || '').trim() });
                    if (currentUser) currentUser.totp_enabled = true;
                    renderOauthBind(currentUser || {});
                    showToast('动态令牌已启用', 'ok');
                    return true;
                  } catch (error) {
                    showToast(error.message || '启用失败', 'error');
                    return false;
                  }
                }
              });
            }

            function showProfileStatus(text, kind) {
