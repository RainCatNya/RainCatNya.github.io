<!DOCTYPE html>

<html lang="zh">
    <head>
        <!-- 元数据 -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=0.8">
        <base href="/">
        <title data-i18n="meta.profile">meta.profile</title>

        <!-- 加载资源 -->
        <link rel="icon" type="image/x-icon" href="assets/Icon/foraine-icon-v2.png">
        <link rel="stylesheet" href="/style/main.css?v=40">
        <link rel="stylesheet" href="/style/page-profile.css?v=40">
        <link rel="stylesheet" href="/style/page-d1.css?v=40">
        <link rel="stylesheet" href="/style/page-storage.css?v=40">
        <link rel="stylesheet" href="/style/page-site.css?v=40">
        <link rel="stylesheet" href="/style/page-foraine-toast.css?v=40">
        <script>
            if (matchMedia('(max-width: 900px)').matches) {
                const mediaLink = document.createElement('link');
                mediaLink.rel = 'stylesheet';
                mediaLink.href = '/style/main-media.css';
                document.head.appendChild(mediaLink);
            }
        </script>
        <!-- 加载脚本 -->
        <script src="/script/i18n.js?v=40" defer></script>
        <script src="/script/core.js?v=40" defer></script>
        <script src="/script/ui.js?v=40" defer></script>
        <script src="/script/transition.js?v=40" defer></script>
        <script src="/script/header.js?v=40" defer></script>
        <script src="/script/layout.js?v=40" defer></script>
        <script src="/script/rain-sound.js?v=40" defer></script>
        <script src="/script/d1-console.js?v=40" defer></script>
        <script src="/script/highlight.js?v=40" defer></script>
        <script src="/script/qr.js?v=40" defer></script>
        <script src="/script/oss-console.js?v=40" defer></script>
        <script src="/script/site-flags.js?v=40" defer></script>
        <!-- 作品卡片上的标题与简介也能用自定行内 DOM (inlinePlain): 要 latex 先于 markdown -->
        <script src="/script/latex.js?v=40" defer></script>
        <script src="/script/markdown.js?v=40" defer></script>
    </head>

    <body>
        <div class="page-layout">

            <div class="profile-layout">

                <!-- 左侧 -->
                <aside class="profile-side No-slc" data-anim>

                    <!-- 头像 -->
                    <img id="profile-avatar" class="profile-avatar" src="assets/Icon/foraine-icon-v2.png" data-i18n-alt="name.avatar">
                    <h1 id="profile-nickname" class="profile-nickname">...</h1>
                    <!-- @用户名、角色 -->
                    <p id="profile-meta" class="profile-meta"></p>
                    <p id="profile-bio" class="profile-bio"></p>

                    <!-- 文章、追随者数 -->
                    <div class="profile-stats-row">
                        <p class="profile-stat" id="profile-stat" hidden></p>
                        <p class="profile-stat" id="profile-stat-followers" hidden></p>
                    </div>

                    <!-- 关注。私聊-->
                    <div class="profile-actions" id="profile-actions" hidden></div>

                    <!-- 信息列表 -->
                    <div class="profile-info" id="profile-info"></div>
                </aside>

                <!-- 右侧 -->
                <div class="profile-main" data-anim>
                    <div class="ban-banner" id="ban-banner" hidden></div>
                    <div class="pending-banner" id="pending-banner" hidden></div>

                    <!-- 页签 -->
                    <nav class="profile-tabs No-slc" id="profile-tabs">
                        <!-- 资料 -->
                        <button class="profile-tab active" data-tab="profile" onclick="switchProfileTab('profile')" data-i18n="profile.tab.profile"></button>
                        <!-- 个性化 -->
                        <button class="profile-tab" data-tab="custom" id="profile-tab-custom" onclick="switchProfileTab('custom')" data-i18n="profile.tab.custom"></button>
                        <!-- 作品 -->
                        <button class="profile-tab" data-tab="articles" onclick="switchProfileTab('articles')" data-i18n="profile.tab.works"></button>
                        <button class="profile-tab" data-tab="members" onclick="switchProfileTab('members')" data-i18n="profile.tab.members"></button>
                        <!-- 站内信 -->
                        <button class="profile-tab" data-tab="notices" id="profile-tab-notices" onclick="switchProfileTab('notices')">
                            <span data-i18n="profile.tab.inbox"></span><span class="tab-count tab-count-alert" id="tab-notice-count" hidden></span>
                        </button>
                        <!-- D1 -->
                        <button class="profile-tab" data-tab="d1" id="profile-tab-d1" hidden onclick="switchProfileTab('d1')" data-i18n="profile.tab.d1"></button>
                        <!-- OSS -->
                        <button class="profile-tab" data-tab="r2" id="profile-tab-r2" hidden onclick="switchProfileTab('r2')" data-i18n="profile.tab.r2"></button>
                        <!-- 站点方案 -->
                        <button class="profile-tab" data-tab="site" id="profile-tab-site" hidden onclick="switchProfileTab('site')" data-i18n="profile.tab.foraine"></button>
                        <!-- 紫条~ -->
                        <span class="profile-tab-indicator" id="tab-indicator"></span>
                    </nav>

                    <!-- 资料标签页 -->
                    <section class="profile-panel" id="tab-profile">
                    <div id="profile-edit-fields">
                      
                        <!-- 头像栏 -->
                        <div class="profile-field">
                            <span class="profile-field-label"><span class="profile-field-icon" data-icon="avatar"></span><div data-i18n="name.avatar"></div></span>
                            <div class="profile-field-body profile-avatar-row">
                                <img class="profile-avatar-thumb" id="avatar-thumb" src="/assets/Icon/foraine-icon-v2.png">
                                <input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden onchange="uploadAvatar(this)">
                                <button class="btn-acrylic" id="avatar-upload" onclick="document.getElementById('avatar-file').click()" data-i18n="profile.pf.avatar.btn-upload"></button>
                            </div>
                        </div>

                        <!-- 昵称栏 -->
                        <div class="profile-field">
                            <span class="profile-field-label"><span class="profile-field-icon" data-icon="user"></span><div data-i18n="profile.pf.nickname"></div></span>
                            <div class="profile-field-body">
                                <input type="text" id="nickname-input" maxlength="40" autocomplete="off" data-i18n-placeholder="profile.pf.nickname.input.placeholder">
                            </div>
                        </div>
                        
                        <!-- 简介栏 -->
                        <div class="profile-field profile-field-top">
                            <span class="profile-field-label"><span class="profile-field-icon" data-icon="note"></span><div data-i18n="profile.pf.bio"></div></span>
                            <div class="profile-field-body">
                                <textarea id="bio-input" rows="1" maxlength="300"  data-i18n-placeholder="profile.pf.bio.input.placeholder"></textarea>
                            </div>
                        </div>

                        <!-- 邮箱栏 -->
                        <div class="profile-field">
                            <span class="profile-field-label"><span class="profile-field-icon" data-icon="mail"></span><div data-i18n="name.email"></div></span>
                            <div class="profile-field-body">
                                <input type="text" id="email-input" maxlength="120" autocomplete="off" data-i18n-placeholder="email.input.placeholder">
                                <div class="email-notice" id="email-notice" hidden>
                                    <button type="button" class="btn-acrylic" id="email-notice-btn"></button>
                                    <p class="email-notice-text" id="email-notice-text"></p>
                                </div>
                            </div>
                        </div>

                        <!-- 位置栏 -->
                        <div class="profile-field">
                            <span class="profile-field-label"><span class="profile-field-icon" data-icon="pin"></span><div data-i18n="profile.pf.location"></div></span>
                            <div class="profile-field-body">
                                <input type="text" id="extra-location" maxlength="80" autocomplete="off" data-i18n-placeholder="profile.pf.location.input.placeholder">
                                <button type="button" class="btn-acrylic profile-locate" id="profile-locate" onclick="locateMe()" data-i18n="opt.locate"></button>
                            </div>
                        </div>

                        <!-- 其他栏 -->
                        <div class="profile-field profile-field-top">
                            <span class="profile-field-label"><span class="profile-field-icon" data-icon="list"></span><div data-i18n="profile.pf.other"></div></span>
                            <div class="profile-field-body">
                                <textarea id="other-input" rows="1" maxlength="500" data-i18n-placeholder="profile.pf.other.input.placeholder"></textarea>
                            </div>
                        </div>

                        <!-- 保存更改/取消 -->
                        <div class="profile-field profile-field-actions">
                            <span class="profile-field-label"></span>
                            <div class="profile-field-body">
                                <button class="btn-ok" id="profile-save" onclick="saveProfileChanges()" disabled data-i18n="opt.save-changes"></button>
                                <button class="btn-outline" id="profile-cancel" onclick="cancelProfileChanges()" hidden data-i18n="opt.cancel"></button>
                            </div>
                        </div>

                        <!-- 关联栏 -->
                        <div class="profile-field">
                            <span class="profile-field-label"><span class="profile-field-icon" data-icon="link"></span><div data-i18n="profile.pf.connection"></div></span>
                            <div class="profile-field-body profile-oauth" id="profile-oauth" hidden></div>
                        </div>

                        <!-- 高级栏 -->
                        <div class="profile-field" id="advanced-section" hidden>
                            <span class="profile-field-label"><span class="profile-field-icon" data-icon="shield"></span><div data-i18n="profile.pf.advanced"></div></span>
                            <div class="profile-field-body">
                                <label class="ctx-card" for="dev-tools">
                                    <span class="ctx-card-main">
                                        <span class="custom-card-title" data-i18n="name.advanced.devtools"></span>
                                        <span class="ctx-note" data-i18n="profile.pf.advanced.devtools.description"></span>
                                    </span>
                                    <span class="ctx-switch">
                                        <input type="checkbox" id="dev-tools">
                                        <span class="ctx-switch-track"></span>
                                    </span>
                                </label>
                            </div>
                        </div>

                        <!-- 账号栏 -->
                        <div class="profile-field">
                            <span class="profile-field-label"><span class="profile-field-icon" data-icon="logout"></span><div data-i18n="name.account"></div></span>
                            <div class="profile-field-body account-actions">
                               <!-- 行一 -->
                                <div class="account-row">
                                    <button class="btn-acrylic" id="reset-password" onclick="resetPassword()" data-i18n="account.resetPassword"></button>
                                    <button class="btn-acrylic" id="email-verify" onclick="verifyEmail()" hidden data-i18n="account.verifyEmail"></button>
                                    <button class="btn-acrylic" id="email-rebind" onclick="rebindEmailStart()" hidden data-i18n="account.changeEmail"></button>
                                </div>
                                <!-- 行二 -->
                                <div class="account-row">
                                    <button class="btn-acrylic-danger" onclick="logout()" data-i18n="account.logOut"></button>
                                    <button class="btn-danger" id="account-delete" onclick="deleteAccount()" data-i18n="account.deleteAccount"></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 访客模式: 只读资料  -->
                    <div id="profile-readonly" hidden></div>
                    </section>

                    <!-- 个性化 -->
                    <section class="profile-panel" id="tab-custom" hidden>
                        <div class="custom-section">
                            <h2 class="custom-section-title" data-i18n="profile.cst.display"></h2>
                            <p class="custom-section-hint" data-i18n="profile.cst.display.label"></p>
                            <div class="profile-custom">
                                <div class="custom-card" id="card-profile-bg">
                                    <div class="custom-card-head">
                                        <span class="custom-card-title" data-i18n="profile.cst.display.profileBackgound"></span>
                                    </div>
                                    <div class="custom-thumb" id="thumb-profile-bg">
                                        <span class="custom-thumb-empty" data-i18n="opt.NotSet"></span>
                                    </div>
                                    <div class="custom-card-actions">
                                        <button type="button" class="btn-acrylic editor-image-btn" onclick="pickCustomImage('profile')">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="m7.5 8.5 4.5-4.5 4.5 4.5"></path><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"></path></svg>
                                            <div data-i18n="opt.upload"></div>
                                        </button>
                                        <button type="button" class="btn-outline" id="clear-profile-bg" onclick="removeCustomImage('profile')" hidden data-i18n="opt.remove"></button>
                                    </div>
                                    <label class="custom-blur" id="blur-row-profile">
                                        <span class="custom-blur-label" data-i18n="name.blur"></span>
                                        <input type="range" id="blur-profile" min="0" max="100" step="1" value="0">
                                        <span class="custom-blur-value" id="blur-profile-value">0</span>
                                    </label>
                                </div>

                                <div class="custom-card" id="card-chat-bg">
                                    <div class="custom-card-head">
                                        <span class="custom-card-title" data-i18n="profile.cst.display.chatBackgound"></span>
                                    </div>
                                    <div class="custom-thumb" id="thumb-chat-bg">
                                        <span class="custom-thumb-empty" data-i18n="opt.NotSet"></span>
                                    </div>
                                    <div class="custom-card-actions">
                                        <button type="button" class="btn-acrylic editor-image-btn" onclick="pickCustomImage('chat')">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="m7.5 8.5 4.5-4.5 4.5 4.5"></path><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"></path></svg>
                                            <div data-i18n="opt.upload"></div>
                                        </button>
                                        <button type="button" class="btn-outline" id="clear-chat-bg" onclick="removeCustomImage('chat')" hidden data-i18n="opt.remove"></button>
                                    </div>
                                    <label class="custom-blur" id="blur-row-chat">
                                        <span class="custom-blur-label" data-i18n="name.blur"></span>
                                        <input type="range" id="blur-chat" min="0" max="100" step="1" value="0">
                                        <span class="custom-blur-value" id="blur-chat-value">0</span>
                                    </label>
                                </div>
                                <!-- 一张隐藏的文件选择器, 两张卡片共用 -->
                                <input type="file" id="custom-image-file" accept="image/*" hidden>
                            </div>
                            <!-- 终端文章面板的 key 显示开关 (只有持有 terminal.keyviewer 的人会看到这张卡, 默认关) -->
                            <label class="ctx-card" id="card-term-quotekey" for="term-quotekey" hidden>
                                <span class="ctx-card-main">
                                    <span class="custom-card-title" data-i18n="name.terminal.quotekey"></span>
                                    <span class="ctx-note" data-i18n="profile.cst.display.quotekey.description"></span>
                                </span>
                                <span class="ctx-switch">
                                    <input type="checkbox" id="term-quotekey">
                                    <span class="ctx-switch-track"></span>
                                </span>
                            </label>
                        </div>

                        <!-- 语言栏 -->
                        <div class="custom-section" id="language-section">
                            <h2 class="custom-section-title" data-i18n="profile.cst.char"></h2>
                            <label class="ctx-card" for="site-language">
                                <span class="ctx-card-main">
                                    <span class="custom-card-title" data-i18n="profile.cst.char.language"></span>
                                    <span class="ctx-note" data-i18n="profile.cst.char.language.description"></span>
                                </span>
                                <select id="site-language"></select>
                            </label>
                            <!-- 字体卡片 [目前隐藏]-->
                            <div class="custom-card" id="card-font" hidden>
                                <div class="custom-card-head">
                                    <span class="custom-card-title" data-i18n="profile.cst.char.font"></span>
                                </div>
                                <p class="custom-card-hint" data-i18n="profile.cst.char.font.notice"></p>
                                <div class="font-choices" id="font-choices"></div>
                            </div>
                        </div>

                        <!-- 交互栏 -->
                        <div class="custom-section" id="ctx-section">
                            <h2 class="custom-section-title" data-i18n="profile.cst.interact"></h2>
                            <p class="custom-section-hint" data-i18n="notice.EffectToYourOwnDeviceOnly"></p>
                            <label class="ctx-card" for="ctx-capture">
                                <span class="ctx-card-main">
                                    <span class="custom-card-title" data-i18n="ctrl.cst.interact.rightclick-override"></span>
                                    <span class="ctx-note" data-i18n="ctrl.cst.interact.rightclick-override.description"></span>
                                </span>
                                <span class="ctx-switch">
                                    <input type="checkbox" id="ctx-capture">
                                    <span class="ctx-switch-track"></span>
                                </span>
                            </label>
                        </div>

                        <!-- 声音栏 -->
                        <div class="custom-section" id="sound-section">
                            <h2 class="custom-section-title" data-i18n="profile.cst.sound"></h2>
                            <p class="custom-section-hint" data-i18n="notice.EffectToYourOwnDeviceOnly"></p>
                            <label class="ctx-card" for="rain-sound">
                                <span class="ctx-card-main">
                                    <span class="custom-card-title title-pluviophile" data-i18n="ctrl.cst.sound.pluviophile"></span>
                                    <span class="ctx-note" data-i18n="ctrl.cst.sound.pluviophile.description"></span>
                                </span>
                                <span class="ctx-switch">
                                    <input type="checkbox" id="rain-sound">
                                    <span class="ctx-switch-track"></span>
                                </span>
                            </label>
                        </div>
                    </section>

                    <!-- 作品标签页 -->
                    <section class="profile-panel" id="tab-articles" hidden>
                        <h2 class="tab-section-title" data-i18n="name.article"></h2>
                        <div class="tab-head">
                            <span class="tab-hint" id="article-hint"></span>
                        </div>
                        <div class="article-grid" id="my-article-list">
                            <p class="editor-hint" data-i18n="hint.loading"></p>
                        </div>

                        <!-- 资源栏 -->
                        <h2 class="tab-section-title" data-i18n="name.resource"></h2>
                        <div class="tab-head">
                            <span class="tab-hint" id="my-resource-hint"></span>
                        </div>
                        <div class="article-grid" id="my-resource-list"></div>
                    </section>

                    <section class="profile-panel" id="tab-members" hidden>
                        <!-- 头部一行: 左侧「共 N 星点」, 右侧排序切换 (按名称 / 按编号, 都是正序) -->
                        <div class="tab-head">
                            <span class="tab-hint" id="member-hint"></span>
                            <span class="tab-head-actions">
                                <button type="button" class="sort-toggle" id="member-sort" onclick="toggleMemberSort()">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16"></path><path d="m3 8 4-4 4 4"></path><path d="M17 20V4"></path><path d="m13 16 4 4 4-4"></path></svg>
                                    <span id="member-sort-label">按编号排序</span>
                                </button>
                            </span>
                        </div>
                        <div class="member-grid" id="member-grid">
                            <p class="editor-hint" data-i18n="hint.loading"></p>
                        </div>
                        <div class="member-more" id="member-more-wrap" hidden>
                            <button class="btn-outline" onclick="loadMoreMembers()" data-i18n="opt.loadMore"></button>
                        </div>
                    </section>

                    <!-- 站内信 -->
                    <section class="profile-panel" id="tab-notices" hidden>
                        <div class="tab-head">
                            <span class="tab-hint" id="notice-hint"></span>
                            <span class="tab-head-actions">
                                <button class="btn-outline" id="notice-read-all" onclick="markAllNoticesRead()" hidden data-i18n="opt.MarkAll-Read"></button>
                                <button class="btn-acrylic" onclick="openSendNotice()" data-i18n="opt.sendInbox"></button>
                            </span>
                        </div>
                        <div class="notice-list" id="notice-list">
                            <p class="editor-hint" data-i18n="hint.loading"></p>
                        </div>
                    </section>

                    <!-- D1 控制台 -->
                    <section class="profile-panel" id="tab-d1" hidden>
                        <div class="d1-console">
                            <div class="d1-tabbar">
                                <div class="d1-tab-list" id="d1-tab-list"></div>
                                <button type="button" class="d1-tab-add" id="d1-tab-add">＋</button>
                                <div class="d1-picker" id="d1-picker" hidden></div>
                            </div>
                            <div class="d1-toolbar">
                                <select class="d1-limit" id="d1-limit">
                                    <option value="50" data-i18n="value.lines" data-i18n-value="50"></option>
                                    <option value="100" data-i18n="value.lines" data-i18n-value="100"></option>
                                    <option value="200" data-i18n="value.lines" data-i18n-value="200"></option>
                                    <option value="1000000" data-i18n="term.max"></option>
                                </select>
                                <input type="text" class="d1-sql" id="d1-sql" spellcheck="false" autocomplete="off">
                                <button type="button" class="btn" id="d1-run" data-i18n="opt.run"></button>
                                <button type="button" class="btn-acrylic" id="d1-reload" data-i18n="opt.reflesh"></button>
                            </div>
                            <div class="d1-body" id="d1-body"></div>
                            <div class="d1-statusbar">
                                <div class="d1-status" id="d1-status"></div>
                                <button type="button" class="btn-outline d1-refresh" id="d1-revert" hidden data-i18n="opt.discard-changes"></button>
                            </div>
                        </div>
                    </section>

                    <!-- OSS标签页 -->
                    <section class="profile-panel" id="tab-r2" hidden>
                        <div class="d1-console">
                            <div class="d1-tabbar">
                                <div class="d1-tab-list" id="r2-tab-list"></div>
                            </div>
                            <div class="d1-toolbar">
                                <button type="button" class="btn-acrylic d1-icon-btn" id="r2-up">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
                                </button>
                                <input type="text" class="d1-sql" id="r2-prefix" spellcheck="false" autocomplete="off"
                                       onkeydown="if(event.key==='Enter')window.r2Console.go()">
                                <button type="button" class="btn" id="r2-go" data-i18n="opt.open"></button>
                                <button type="button" class="btn-acrylic" id="r2-refresh" data-i18n="opt.reflesh"></button>
                            </div> 
                            <div class="d1-body" id="r2-body"></div>
                            <div class="d1-status" id="r2-status"></div>
                        </div>
                    </section>

                    <!-- 「Foraine」页签 -->
                    <section class="profile-panel" id="tab-site" hidden>
                        <div class="site-flags">
                            <div class="site-flag" id="site-flag-downlink">
                                <div class="site-flag-head">
                                    <h2 class="site-flag-title" data-i18n="foraine.DownstreamTrafficControl"></h2>
                                    <span class="site-flag-scope" data-i18n="term.global"></span>
                                </div>
                                <label class="site-flag-toggle">
                                    <span class="ctx-switch">
                                        <input type="checkbox" id="flag-downlink">
                                        <span class="ctx-switch-track"></span>
                                    </span>
                                    <span class="site-flag-state" id="flag-downlink-state" data-i18n="hint.loading"></span>
                                </label>
                                <p class="site-flag-hint" data-i18n="foraine.DownstreamTrafficControl.description"></p>
                            </div>
                            <div class="site-flag" id="site-flag-quota">
                                <div class="site-flag-head">
                                    <h2 class="site-flag-title" data-i18n="foraine.MaximumResourcesLimit"></h2>
                                    <span class="site-flag-scope" data-i18n="term.global"></span>
                                </div>
                                <label class="site-flag-toggle">
                                    <span class="ctx-switch">
                                        <input type="checkbox" id="flag-quota">
                                        <span class="ctx-switch-track"></span>
                                    </span>
                                    <span class="site-flag-state" id="flag-quota-state" data-i18n="hint.loading"></span>
                                </label>
                                <p class="site-flag-hint" data-i18n="foraine.MaximumResourcesLimit.description"></p>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
            <!-- 弹性留白 -->
            <div class="spacer-flex"></div>
        </div>

        <script>
            /* profile.html */
            const PUBLIC_MATCH = location.pathname.match(/^\/u\/([^/]+)\/?$/);
            const PUBLIC_USERNAME = PUBLIC_MATCH
              ? decodeURIComponent(PUBLIC_MATCH[1])
              : (new URLSearchParams(location.search).get('u') || '');
            const isPublicView = !!PUBLIC_USERNAME;

            // Token未登录时跳转登录页
            document.addEventListener('DOMContentLoaded', () => {
              if (!isPublicView) initAuthGuard({ requireAuth: true });
            });

            let currentUser = null;
            let publicArticles = null;
            let publicViewUser = null;

            /* 左侧资料栏 */
            const ICONS = {
              book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>',
              clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>',
              mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m2 7 10 6 10-6"></path></svg>',
              link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7L12 5"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7L12 19"></path></svg>',
              pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.7-7-11a7 7 0 1 1 14 0c0 5.3-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>',
              building: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.5"></rect><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"></path></svg>',
              info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>',
              /* 资料表的行图标 */
              user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>',
              badge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 2.6v5.6c0 4.3-2.9 7.9-7 9.8-4.1-1.9-7-5.5-7-9.8V5.6z"></path></svg>',
              /* 头像行 */
              avatar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="10" r="3"></circle><path d="M6.6 18.4a6.5 6.5 0 0 1 10.8 0"></path></svg>',
              note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>',
              list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"></path><circle cx="3.5" cy="6" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="3.5" cy="12" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="3.5" cy="18" r="1.2" fill="currentColor" stroke="none"></circle></svg>',
              logout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>',
              /* 个性化 */
              sparkle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="8.5" cy="9.5" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="12" cy="7.5" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="9.5" r="1.2" fill="currentColor" stroke="none"></circle><path d="M12 21a3 3 0 0 1 0-6 3 3 0 0 0 0-6"></path></svg>',
              check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 6"></path></svg>',
              /* 连携星点 & 权限圆点与通知类型 */
              star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.8C12.5 7.5 16.5 11.5 22.2 12 16.5 12.5 12.5 16.5 12 22.2 11.5 16.5 7.5 12.5 1.8 12 7.5 11.5 11.5 7.5 12 1.8Z"></path></svg>',
              shield: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l7 2.6v5.6c0 4.3-2.9 7.9-7 9.8-4.1-1.9-7-5.5-7-9.8V5.6z"></path></svg>',
              lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>',
              bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>',
              chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.3 9.3 0 0 1-3.2-.6L3.5 21l1.7-4.6A8.3 8.3 0 0 1 4 11.5a8.4 8.4 0 0 1 8.5-8.4A8.4 8.4 0 0 1 21 11.5z"></path></svg>',
              trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M10 11v6M14 11v6"></path><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"></path><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>'
            };

            function paintFieldIcons() {
              document.querySelectorAll('.profile-field-icon[data-icon]').forEach((box) => {
                const name = box.dataset.icon;
                box.innerHTML = (name === 'github' ? GH_ICON : ICONS[name]) || ICONS.info;
              });
            }

            // 自定义信息对应的标签
            const INFO_ICON_RULES = [
              [/位置|地点|城市|所在地|坐标/i, 'pin'],
              [/公司|组织|单位|团队|学校/i, 'building'],
              [/链接|网站|博客|主页|url/i, 'link'],
              [/邮箱|邮件|mail/i, 'mail'],
              [/时间|时区|生日/i, 'clock']
            ];

            function cleanOther(raw) {
              // 清除老数据的占位符 ({}/[]/null)
              const text = String(raw || '').trim();
              return /^(\{\s*\}|\[\s*\]|null|undefined)$/i.test(text) ? '' : text;
            }

            function parseOther(raw) {
              // 解析Other栏，一行一条
              return cleanOther(raw).split(/\r?\n/).map((line) => {
                const text = line.trim();
                if (!text) return null;
                const idx = text.search(/[:：]/);
                if (idx < 0) return { label: '', value: text };
                return { label: text.slice(0, idx).trim(), value: text.slice(idx + 1).trim() };
              }).filter(Boolean);
            }

            function infoRow(icon, text, href, textClass) {
              const row = el('p', 'profile-info-row');
              const holder = document.createElement('span');
              holder.innerHTML = ICONS[icon] || ICONS.info;
              if (holder.firstChild) row.appendChild(holder.firstChild);
              if (href) {
                const a = el('a', textClass || null, text);
                a.href = href;
                if (href.indexOf('mailto:') !== 0) {
                  a.target = '_blank';
                  a.rel = 'noopener noreferrer';
                }
                row.appendChild(a);
              } else if (textClass) {
                row.appendChild(el('span', textClass, text));
              } else {
                row.appendChild(document.createTextNode(text));
              }
              return row;
            }

            function localTimeText() {
              // 本地时间
              const now = new Date();
              const offset = -now.getTimezoneOffset();
              const sign = offset >= 0 ? '+' : '-';
              const abs = Math.abs(offset);
              const hh = String(Math.floor(abs / 60)).padStart(2, '0');
              const mm = String(abs % 60).padStart(2, '0');
              return now.toTimeString().slice(0, 5) + ' (UTC ' + sign + hh + ':' + mm + ')';
            }

            function renderProfileSide(user) {
              if (!user) return;
              // @用户名
              const role = realRole(user);
              document.getElementById('profile-meta').textContent = '@' + user.username;
              // 站长的神秘红色用户名
              document.querySelector('.profile-side').classList.toggle('is-owner', role === '站长');

              const box = document.getElementById('profile-info');
              box.innerHTML = '';
              box.appendChild(infoRow('clock', localTimeText()));
              /* 邮箱: 验证后才对外展示，看别人主页时只在双方互相关注时才显示 */
              const isMe = !!(currentUser && currentUser.username === user.username);
              const mail = (user.email_verified && user.email)
                ? user.email
                : (isMe && currentUser.email_verified ? currentUser.email : '');
              if (mail) {
                box.appendChild(infoRow('mail', mail, 'mailto:' + mail));
              }
              if (user.github_login) {
                box.appendChild(infoRow('link', 'github.com/' + user.github_login, 'https://github.com/' + user.github_login));
              }
              parseOther(user.other).forEach((item) => {
                const rule = INFO_ICON_RULES.find((r) => r[0].test(item.label));
                const isUrl = /^https?:\/\//i.test(item.value);
                box.appendChild(infoRow(
                  rule ? rule[1] : 'info',
                  item.label ? item.label + '：' + item.value : item.value,
                  isUrl ? item.value : null
                ));
              });

              // 计算最后登录、加入Foraine天数
              if (isPublicView && !isMe) {
                if (user.id) box.appendChild(infoRow('user', 'ID：' + user.id));
                if (user.created_at) {
                  const days = Math.max(1, Math.floor((Date.now() - Number(user.created_at)) / 86400000) + 1);
                  box.appendChild(infoRow('clock', I18N.t('value.theDayJoinFoarine', {value: days})));
                }
                box.appendChild(infoRow('clock', user.last_login_at
                  ? I18N.t('value.lastLogin', {value: formatTime(user.last_login_at)})
                  : I18N.t('value.lastLogin', {value: I18N.t('term.unknown')})));
              }
              box.appendChild(infoRow('badge', roleMeta(role).label, null,
                'profile-role role-' + roleMeta(role).key));
            }

            function renderArticleStat(count) {
              const stat = document.getElementById('profile-stat');
              stat.innerHTML = '';
              const holder = document.createElement('span');
              holder.innerHTML = ICONS.book;
              if (holder.firstChild) stat.appendChild(holder.firstChild);
              stat.appendChild(el('span', null, I18N.t('value.articleNumber', {value: count})));
              stat.hidden = false;

              // 文章标签页顶部那一行
              const hint = document.getElementById('article-hint');
              if (hint) hint.textContent = count ? I18N.t('value.articleNumber', {value: count}) : I18N.t('term.none');
              moveTabIndicator();
            }

            /* 选项卡 */
            let currentTab = null;

            // 切页时滑动方向
            const TAB_ORDER = ['profile', 'custom', 'articles', 'members', 'notices', 'd1', 'r2', 'site'];

            function tabPanel(name) {
              return document.getElementById('tab-' + name);
            }

            // 紫色滑条~
            let tabIndicatorPlaced = false;
            function moveTabIndicator() {
              const nav = document.getElementById('profile-tabs');
              const bar = document.getElementById('tab-indicator');
              const active = nav && nav.querySelector('.profile-tab.active');
              if (!nav || !bar || !active) return;

              if (!tabIndicatorPlaced) {
                // 记住已经放过的位置，并在返回时直接定位
                bar.style.transition = 'none';
                bar.style.width = active.offsetWidth + 'px';
                bar.style.transform = 'translateX(' + active.offsetLeft + 'px)';
                void bar.offsetWidth;
                bar.style.transition = '';
                tabIndicatorPlaced = true;
                return;
              }
              bar.style.width = active.offsetWidth + 'px';
              bar.style.transform = 'translateX(' + active.offsetLeft + 'px)';
            }

            function switchProfileTab(name, options) {
              let tab = TAB_ORDER.includes(name) ? name : 'profile';
              // 隐藏公共视角的标签页
              if (isPublicView && (tab === 'notices' || tab === 'members' || tab === 'd1' || tab === 'r2' || tab === 'site' || tab === 'custom')) tab = 'profile';
              // 隐藏俩站长的标签页呐
              if ((tab === 'd1' || tab === 'r2' || tab === 'site') && !amISiteOwner()) tab = 'profile';
              const from = currentTab;
              currentTab = tab;

              document.querySelectorAll('.profile-tab').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
              });
              TAB_ORDER.forEach((key) => {
                const panel = tabPanel(key);
                if (panel) panel.hidden = key !== tab;
              });

              // 渐入
              const animate = from && from !== tab && !(options && options.silent);
              if (animate) {
                const panel = tabPanel(tab);
                const dir = TAB_ORDER.indexOf(tab) > TAB_ORDER.indexOf(from) ? 'right' : 'left';
                panel.classList.remove('tab-enter-left', 'tab-enter-right');
                void panel.offsetWidth; // 强制回流, 动画才重播
                panel.classList.add('tab-enter-' + dir);
              }

              moveTabIndicator();
              if (!options || !options.silent) {
                // 必须拼绝对路径
                history.replaceState(null, '', location.pathname + location.search +
                  (tab === 'profile' ? '' : '#' + tab));
              }

              // 一点懒加载
              if (tab === 'members' && !membersLoaded) loadMemberCards();
              if (tab === 'notices' && !noticesLoaded) loadNotices();
              if (tab === 'articles' && !resourcesLoaded) loadMyResources();
              if (tab === 'd1' && window.d1Console) window.d1Console.open();
              if (tab === 'r2' && window.r2Console) window.r2Console.open();
              if (tab === 'site' && window.siteFlags) window.siteFlags.open();
              /* 作品栏的卡片瀑布流要等这一栏真的显示出来才量得到宽度 (藏着的元素 clientWidth 是 0) */
              if (tab === 'articles') {
                layoutCardColumns(document.getElementById('my-article-list'));
                layoutCardColumns(document.getElementById('my-resource-list'));
              }
            }

            // 视奸视窗变化，避免横条位置出错
            window.addEventListener('resize', moveTabIndicator);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveTabIndicator);

            /* 页签上的徽章 (文章数/未读数/成员数)  */
            if (window.ResizeObserver) {
              const tabObserver = new ResizeObserver(() => {
                if (tabIndicatorPlaced) moveTabIndicator();
              });
              document.querySelectorAll('.profile-tab').forEach((btn) => tabObserver.observe(btn));
            }

            document.addEventListener('DOMContentLoaded', () => {
              paintFieldIcons();
              bindProfileForm();
              bindProfileShortcuts();
              // 背景图层高度随内容量变化
              bindBgLayerSync();
              // 验证邮件的resetToken带回本页
              const resetToken = new URLSearchParams(location.search).get('reset');
              if (resetToken && !isPublicView) {
                // 身份认证完成时弹重置框, 期间挂「加载中」
                const busy = showForaineToast({ text: I18N.t('foraine-toast.loading'), block: true });
                getCurrentUser().then((u) => {
                  busy.close();
                  if (u) openPasswordResetDialog(resetToken);
                  else location.replace('/login.html?reset=' + encodeURIComponent(resetToken));
                }).catch(() => busy.close());
              }
              // 事已至此，先Loading吧
              ['my-article-list', 'member-grid', 'notice-list'].forEach((id) => {
                const box = document.getElementById(id);
                if (box) {
                  box.innerHTML = '';
                  box.appendChild(loadingState());
                }
              });
              // 公开主页直接拉去数据
              if (isPublicView) {
                ['notices', 'members', 'custom'].forEach((name) => {
                  const tab = document.querySelector('.profile-tab[data-tab="' + name + '"]');
                  if (tab) tab.remove();
                });
                moveTabIndicator();
                getCurrentUser().then((viewer) => {
                  if (!viewer) return;
                  currentUser = viewer;
                  if (publicArticles) renderArticleCards(publicArticles);
                  // 重绘侧栏
                  if (publicViewUser) renderProfileSide(publicViewUser);
                });
                loadPublicProfile();
                switchProfileTab(location.hash === '#profile' ? 'profile' : 'articles', { silent: true });
              }
            });

            window.addEventListener('authready', async (e) => {
              const user = e.detail.user;
              if (!user) return;
              currentUser = user;

              document.getElementById('profile-nickname').textContent = user.nickname || user.username;
              if (user.avatar_url) document.getElementById('profile-avatar').src = user.avatar_url;
              setAvatarPreview(user.avatar_url);
              document.getElementById('profile-bio').textContent = user.bio || I18N.t('profile.pf.bio.ph');
              applyEmailState(user);
              fillProfileForm(user);

              renderProfileSide(user);
              renderOauthBind(user);
              renderEmailAction(user);
              renderAccountGates(user);
              loadMyArticles();
              loadFollowState(user.username);

              // 封禁横幅、未读站内信角标
              renderBanBanner(user);
              // 注销申请横幅 (如果有的话; 请不要退出Foraine啦..呜..)
              renderPendingBanner(user);
              setUnreadBadge(user.unread || 0);

              // 站长专属的d1,r2,site
              if (amISiteOwner()) {
                const advanced = document.getElementById('advanced-section');
                if (advanced) advanced.hidden = false;
                applyDevTools();
              }

              // 看别人主页时如果token给到权限则重绘一次
              if (isPublicView && publicArticles) renderArticleCards(publicArticles);

              // 刷新/直链带着 #articles 这类锚点也能停在同一个页签
              const wantTab = location.hash.replace('#', '');
              switchProfileTab(TAB_ORDER.includes(wantTab) ? wantTab : 'profile', { silent: true });

              // 邮件链接回访
              const EMAIL_RESULT = {
                verified: [I18N.t('toast.email.ok-verifySuccessful'), 'ok'],
                unbound: [I18N.t('toast.email.ok-unboundSuccessful'), 'ok'],
                taken: [I18N.t('toast.email.warn-VerificationTakenByOther'), 'warn'],
                expired: [I18N.t('toast.email.error-LinkExpired'), 'error'],
                changed: [I18N.t('toast.email.error-LinkDead4EmailChanged'), 'error'],
                invalid: [I18N.t('toast.email.error-LinkInvalid'), 'error']
              };
              const emailResult = new URLSearchParams(location.search).get('email');
              if (emailResult && EMAIL_RESULT[emailResult]) {
                showProfileStatus(EMAIL_RESULT[emailResult][0], EMAIL_RESULT[emailResult][1]);
                // 清掉参数
                history.replaceState(null, '', location.pathname + location.hash);
              }

              // 从第三方授权页redirect回来
              const params = new URLSearchParams(location.search);
              if (params.get('github') === 'linked') showProfileStatus(I18N.t('target.linked', {target: 'github'}), 'ok');
            });

            async function loadMyArticles() {
              // 加载文章与草稿
              const list = document.getElementById('my-article-list');
              list.innerHTML = '';
              list.appendChild(loadingState());
              try {
                const response = await fetch('/api/my/articles', { cache: 'no-store' });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || I18N.t('hint.loading.failed'));
                const articles = data.articles || [];
                renderArticleStat(articles.length);
                renderArticleCards(articles);
                replayItems(list, '.article-card');
              } catch (error) {
                showToast(error.message, 'error');
                list.innerHTML = '';
                list.appendChild(emptyState({ icon: 'book' }));
              }
            }

            /* 作品 > 资源 */
            let resourcesLoaded = false;

            async function loadMyResources() {
              const list = document.getElementById('my-resource-list');
              if (!list) return;
              // 等待登录态读取完成后再拉取
              const username = isPublicView
                ? PUBLIC_USERNAME
                : ((currentUser && currentUser.username) || '');
              if (!username) return;
              resourcesLoaded = true;

              list.innerHTML = '';
              list.appendChild(loadingState());
              try {
                const response = await fetch('/api/resources?uploader=' + encodeURIComponent(username) + '&size=50', { cache: 'no-store' });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || I18N.t('hint.loading.failed'));
                renderResourceCards(data.resources || []);
                replayItems(list, '.article-card');
              } catch (error) {
                showToast(error.message, 'error');
                list.innerHTML = '';
                list.appendChild(emptyState({ icon: 'book' }));
              }
            }

            /* 资源卡片 */
            function renderResourceCards(resources) {
              const list = document.getElementById('my-resource-list');
              const hint = document.getElementById('my-resource-hint');
              if (!list) return;
              list.innerHTML = '';
              if (hint) hint.textContent = resources.length ? I18N.t('value.resourceNumber', {value: resources.length}) : '';

              if (resources.length === 0) {
                list.appendChild(emptyState({
                  icon: 'book',
                  title: I18N.t('value.NotYet', {value: I18N.t('name.resource')}),
                  text: isPublicView ? '这位还没有上传过资源' : '在资源中心上传的文件会出现在这里'
                }));
                return;
              }

              resources.forEach((r) => {
                const card = el('div', 'article-card');
                card.appendChild(el('span', 'article-id-badge', '#' + r.id));
                card.appendChild(el('div', 'article-title', r.title || r.name));
                if (r.description) card.appendChild(el('div', 'article-intro', r.description));

                /* /api/resources 返回的是**组卡片**字段 (file_count / total_size / kinds),
                   没有 size / ext / kind —— 直接 formatFileSize(r.size) 会得到「0 B」。
                   形制照资源中心那张卡片来 */
                const meta = el('div', 'article-meta');
                const groupKinds = r.kinds || [];
                groupKinds.slice(0, 3).forEach((k) => {
                  meta.appendChild(el('span', 'resource-tag is-' + k.key, k.label + (k.count > 1 ? ' ' + k.count : '')));
                });
                if (groupKinds.length > 3) meta.appendChild(el('span', 'resource-tag', '+' + (groupKinds.length - 3)));
                if (!groupKinds.length) {
                  meta.appendChild(el('span', 'resource-tag', (r.ext || '').toUpperCase() || '文件'));
                }
                meta.appendChild(el('span', 'resource-size', (r.file_count || 1) + ' 个文件 · ' + formatFileSize(r.total_size)));
                meta.appendChild(el('span', null, formatTime(r.created_at)));
                card.appendChild(meta);

                card.onclick = () => pageTransitionTo('/resource/?id=' + r.id);
                list.appendChild(card);
              });
              layoutCardColumns(list);
            }

            /* 当前登录者是不是站长 (服务端还会再校验一次)。
               ⚠️ 旧的 '*' 串 2026-09-29 已经取消, 现在站长看 `dev.access` */
            function amISiteOwner() {
              const perms = (currentUser && currentUser.permissions) || [];
              return perms.includes('dev.access');
            }
            function canManageOthersArticles() {
              const perms = (currentUser && currentUser.permissions) || [];
              return perms.includes('article.review');
            }

            // 删除别人的文章 (站长直接删)
            async function deleteArticleById(id) {
              const yes = await confirmAction({
                title: '删除文章',
                message: '删除后这篇文章会从列表和首页消失。',
                confirmText: '删除',
                danger: true
              });
              if (!yes) return;
              // 删除文章要验一次密码 (仅需密码)
              if (!(await verifyIdentity({ methods: ['password'] }))) return;
              await withLoading(() => apiPost('/api/articles/delete', { id }));
              showToast('文章已删除', 'ok');
              if (isPublicView) loadPublicProfile(); else loadMyArticles();
            }

            // 审核删除别人的文章 (管理员: 必须填理由, 会留档 + 站内信告知作者)
            async function moderateArticleById(id) {
              await confirmAction({
                title: '审核删除',
                message: '这是别人的文章，删除需要填写理由。\n理由会存档，并作为站内信发给作者。',
                confirmText: '删除并通知作者',
                danger: true,
                warning: '',
                fields: [{
                  name: 'reason',
                  placeholder: '删除理由（必填）',
                  multiline: true,
                  required: true,
                  maxlength: 300
                }],
                onConfirm: async (values) => {
                  await apiPost('/api/moderation/article', { id, reason: values.reason });
                  showToast('已删除，并已通知作者', 'ok');
                  if (isPublicView) loadPublicProfile(); else loadMyArticles();
                }
              });
            }

            // 文章卡片: 自己的主页和别人的主页共用
            function renderArticleCards(articles) {
              /* 卡片上的标题 / 简介也能用 <view …>: 把观看者上下文填上 (走到这里 currentUser 已经就绪) */
              if (typeof setViewContext === 'function') {
                setViewContext({
                  user: currentUser && currentUser.username,
                  nickname: currentUser && (currentUser.nickname || currentUser.username),
                  permissions: (currentUser && currentUser.permissions) || [],
                  time: Date.now()
                });
              }
              const list = document.getElementById('my-article-list');
              list.innerHTML = '';
              renderArticleStat(articles.length);
              if (articles.length === 0) {
                list.appendChild(emptyState({ icon: 'book' }));
                return;
              }

              // 看别人的主页时: 有管理权限的人右键卡片就能删
              const canManage = isPublicView && canManageOthersArticles();
              const directDelete = canManage && amISiteOwner();

              articles.forEach(a => {
                const card = el('div', 'article-card');
                // 右上角灰色编号 (跟文章列表页的 #N 一致)
                card.appendChild(el('span', 'article-id-badge', '#' + a.id));
                const title = (a.title && a.title.trim()) ? a.title : (a.intro || a.summary || '无标题');
                const titleEl = el('div', 'article-title', '');
                titleEl.innerHTML = inlinePlain(title);      // 标题能用自定行内 DOM
                card.appendChild(titleEl);
                // 简介: 作者自己在编辑器里写的那一句 (没写就什么都不显示, 卡片只剩标题)
                if (a.intro) {
                  const introEl = el('div', 'article-intro', '');
                  introEl.innerHTML = inlinePlain(a.intro);    // 简介同理
                  card.appendChild(introEl);
                }
                const meta = el('div', 'article-meta');
                if (isPublicView) {
                  meta.appendChild(el('span', null, formatTime(a.created_at)));
                } else if (a.narra) {
                  /* 叙述没有「草稿 / 已发布」这一说, 只标它是叙述
                     (它不进公开列表, 但自己的作品栏看得到, 终端世界里也有一份) */
                  meta.appendChild(el('span', 'article-narra', I18N.t('name.narra', '叙述')));
                  meta.appendChild(el('span', null, formatTime(a.updated_at || a.created_at)));
                } else {
                  meta.appendChild(el('span', 'article-status', a.status === 'draft' ? '草稿' : '已发布'));
                  meta.appendChild(el('span', null, formatTime(a.updated_at || a.created_at)));
                }
                card.appendChild(meta);
                card.onclick = () => pageTransitionTo('/article/?id=' + a.id);

                if (canManage) {
                  card.oncontextmenu = (e) => {
                    e.preventDefault();
                    showContextMenu(e, [
                      { label: '打开文章', icon: CTX_ICONS.eye, onClick: () => pageTransitionTo('/article/?id=' + a.id) },
                      directDelete
                        ? { label: '删除文章…', danger: true, icon: CTX_ICONS.trash, onClick: () => deleteArticleById(a.id) }
                        : { label: '审核删除…', danger: true, icon: CTX_ICONS.trash, onClick: () => moderateArticleById(a.id) }
                    ]);
                  };
                }
                list.appendChild(card);
              });
              layoutCardColumns(list);
            }

            /* 卡片瀑布流: 顺序仍是从左到右, 但每一列各往上贴 ——
               同一行里矮的那张不该被最高那张撑出空档 (用户 2026-10-01)。
               做法: 按容器宽度算列数, 依次把卡片丢进「当前最矮的那一列」。
               ⚠️ 容器不可见时 clientWidth 是 0: 那时什么都不做 (切到这一栏时会重跑) */
            function layoutCardColumns(grid) {
              if (!grid) return;
              // 先拆回原样 (重渲染 / 换列数都走这条路, 所以要求幂等)
              grid.classList.remove('is-columns');
              Array.prototype.forEach.call(grid.querySelectorAll('.article-col'), (col) => {
                while (col.firstChild) grid.appendChild(col.firstChild);
                col.remove();
              });
              const cards = Array.prototype.filter.call(grid.children, (n) => n.classList.contains('article-card'));
              if (cards.length < 2) return;                 // 一张 (或空状态) 就按原来的走
              const gap = 12;                               // = --sp-3
              const minW = 220;                             // 与原来那套网格同一档
              const count = Math.max(1, Math.floor((grid.clientWidth + gap) / (minW + gap)));
              if (count < 2) return;                        // 一列时本来就是竖排, 不用多包一层
              grid.classList.add('is-columns');
              const cols = [];
              for (let i = 0; i < count; i += 1) {
                const col = el('div', 'article-col');
                grid.appendChild(col);
                cols.push(col);
              }
              cards.forEach((card) => {
                let best = cols[0];
                for (let i = 1; i < cols.length; i += 1) if (cols[i].offsetHeight < best.offsetHeight) best = cols[i];
                best.appendChild(card);
              });
            }

            /* 窗口尺寸变了要重分列 (列数与每张卡的高度都会变); 拖窗口时别每帧都算, 等它停一下 */
            let colResizeTimer = 0;
            window.addEventListener('resize', () => {
              clearTimeout(colResizeTimer);
              colResizeTimer = setTimeout(() => {
                layoutCardColumns(document.getElementById('my-article-list'));
                layoutCardColumns(document.getElementById('my-resource-list'));
              }, 120);
            }, { passive: true });

            /* 头像上传 (阿里云 OSS) */
            const DEFAULT_AVATAR_SRC = '/assets/Icon/foraine-icon-v2.png';
            const AVATAR_MAX_MB = 2;

            function setAvatarPreview(url) {
              // 同一张图同时出现在「头像」行的小预览和左侧大圆里
              const thumb = document.getElementById('avatar-thumb');
              const side = document.getElementById('profile-avatar');
              const src = url || DEFAULT_AVATAR_SRC;
              if (thumb) thumb.src = src;
              if (side && url) side.src = url;
            }

            async function uploadAvatar(input) {
              const file = input.files && input.files[0];
              if (!file) return;

              if (file.size > AVATAR_MAX_MB * 1024 * 1024) {
                showToast(I18N.t('value.TooLarge-mb', {value: AVATAR_MAX_MB}), 'warn');
                input.value = '';
                return;
              }

              const btn = document.getElementById('avatar-upload');
              const form = new FormData();
              form.append('file', file);
              btn.disabled = true;
              btn.textContent = '上传中…';
              try {
                const response = await fetch('/api/avatar', {
                  method: 'POST',
                  body: form, // 注意: 别手动设 Content-Type —— 边界串要由浏览器写
                  cache: 'no-store'
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || '上传失败');
                setAvatarPreview(data.avatar_url);
                if (currentUser) currentUser.avatar_url = data.avatar_url;
                showToast('头像已更新', 'ok');
              } catch (error) {
                showToast(error.message, 'error');
              } finally {
                btn.disabled = false;
                btn.textContent = '上传新头像';
                input.value = '';
              }
            }

            /* 连携星点 (站内用户目录) */
            // 卡片角上的小圆: 颜色 + 图标 = 权限 (站长 / 管理员), 成员不加角标
            const ROLE_DOT = {
              '站长':   { key: 'owner', icon: 'star',   label: '站长' },
              '管理员': { key: 'admin', icon: 'shield', label: '管理员' }
            };
            const DEFAULT_AVATAR = '/assets/Icon/foraine-icon-v2.png';

            let membersLoaded = false;
            let memberPage = 1;
            let memberCan = { moderate: false, remove: false };
            let memberList = []; // 已加载的成员 (关注状态变了要就地改)
            let memberSort = 'id'; // 'id' 按编号 | 'name' 按名称 (两种都是正序, 站长管理员始终在前)

            function toggleMemberSort() {
              memberSort = memberSort === 'id' ? 'name' : 'id';
              const label = document.getElementById('member-sort-label');
              if (label) label.textContent = memberSort === 'id' ? '按编号排序' : '按名称排序';
              reloadMembers();
            }

            async function loadMemberCards(append) {
              const grid = document.getElementById('member-grid');
              if (!append) {
                memberPage = 1;
                grid.innerHTML = '';
                grid.appendChild(loadingState());
              }
              try {
                const response = await fetch('/api/users?page=' + memberPage + '&size=48&sort=' + memberSort, { cache: 'no-store' });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '加载失败');
                membersLoaded = true;
                if (data.can) memberCan = data.can;

                if (!append) memberList = [];
                (data.users || []).forEach((u) => memberList.push(u));
                renderMemberGrid();

                // 「共 N 星点」写在页签内容的最高处 (页签上不再挂徽章)
                const hint = document.getElementById('member-hint');
                if (hint) hint.textContent = '共 ' + (data.total || 0) + ' 星点';
                document.getElementById('member-more-wrap').hidden = !data.hasMore;
              } catch (error) {
                membersLoaded = false;
                grid.innerHTML = '';
                grid.appendChild(el('p', 'editor-hint', error.message || '加载失败'));
              }
            }

            /* 卡片墙整体重画: 关注状态变化时不用重新请求 */
            function renderMemberGrid() {
              const grid = document.getElementById('member-grid');
              if (!grid) return;
              grid.innerHTML = '';
              if (!memberList.length) {
                grid.appendChild(emptyState({ icon: 'star' }));
                return;
              }
              memberList.forEach((u) => grid.appendChild(memberCard(u)));
              // 只重播星点卡 —— 有新内容时不该触发整个标签栏与标签页的动画
              replayItems(grid, '.member-card');
            }

            function loadMoreMembers() {
              memberPage += 1;
              loadMemberCards(true);
            }

            // 做过封禁 / 删号之后重拉一遍 (卡片顺序与状态都可能变)
            function reloadMembers() {
              membersLoaded = false;
              loadMemberCards();
            }

            function memberCard(user) {
              const card = el('div', 'member-card');
              // 右上角的编号 = 用户的 id
              card.appendChild(el('span', 'member-idx', '#' + user.id));
              const avatar = el('div', 'member-avatar');
              const img = document.createElement('img');
              img.alt = '';
              img.loading = 'lazy';
              img.src = user.avatar_url || DEFAULT_AVATAR;
              // 头像源挂了就别一直重试, 退回站点图标
              img.onerror = () => { img.onerror = null; img.src = DEFAULT_AVATAR; };
              avatar.appendChild(img);

              const roleName = (user.roles || []).find((r) => ROLE_DOT[r]);
              if (roleName) {
                const dot = el('span', 'member-role-dot role-' + ROLE_DOT[roleName].key);
                dot.title = ROLE_DOT[roleName].label;
                dot.innerHTML = ICONS[ROLE_DOT[roleName].icon] || '';
                avatar.appendChild(dot);
              }
              card.appendChild(avatar);

              card.appendChild(el('p', 'member-name', user.nickname || user.username));
              card.appendChild(el('p', 'member-username', '@' + user.username));
              /* 关注状态与封禁状态都是给卡片本身上色: 已关注 → 左上角一个紫点 (右上角是权限小圆, 不抢位置);
                    封禁中 → 整张卡红亚克力底 + 红描边 (只给有管理权限的人看) */
              const marks = [];
              if (user.is_following) {
                card.classList.add('is-following');
                marks.push('已关注');
              }
              if (memberCan.moderate && user.banned) {
                card.classList.add('is-banned');
                marks.push('封禁中');
              }
              if (marks.length) card.title = marks.join(' · ');

              card.onclick = () => openMemberProfile(user);
              card.oncontextmenu = (e) => { e.preventDefault(); openMemberMenu(e, user); };
              return card;
            }

            function openMemberProfile(user) {
              pageTransitionTo('/u/' + encodeURIComponent(user.username));
            }

            /* 右键菜单: 权限越高能做的事越多 (成员 ⊂ 管理员 ⊂ 站长)。
                  菜单项按「当前身份」过滤, 服务端还会再校验一次 */
            function openMemberMenu(evt, user) {
              const isSelf = !!(currentUser && currentUser.username === user.username);
              const isOwner = (user.roles || []).includes('站长');
              const isAdmin = (user.roles || []).includes('管理员');

              const items = [
                { label: '查看个人信息', icon: CTX_ICONS.eye, onClick: () => openMemberProfile(user) },
                { label: '查看文章', icon: CTX_ICONS.book, onClick: () => pageTransitionTo('/u/' + encodeURIComponent(user.username) + '#articles') }
              ];

              // 关注 / 私聊 (自己对自己没这两项)
              if (!isSelf) {
                items.push('-');
                items.push({
                  label: user.is_following ? '取消关注' : '关注',
                  icon: user.is_following ? CTX_ICONS.starOff : CTX_ICONS.star,
                  onClick: () => toggleFollow(user.username, !user.is_following)
                });
                items.push({ label: '私聊', icon: CTX_ICONS.chat, onClick: () => openChat(user) });
              }

              // 管理动作: 「封禁」与「设为管理员」放**同一栏**
              if (!isSelf && !isOwner) {
                const manage = [];
                if (memberCan.moderate) {
                  manage.push(user.banned
                    ? { label: '解除封禁…', icon: CTX_ICONS.check, onClick: () => unbanMember(user) }
                    : { label: '封禁…', danger: true, icon: CTX_ICONS.ban, onClick: () => banMember(user) });
                }
                if (memberCan.remove) {
                  manage.push(isAdmin
                    ? { label: '取消管理员', icon: CTX_ICONS.shield, onClick: () => setMemberAdmin(user, false) }
                    : { label: '设为管理员', icon: CTX_ICONS.shield, onClick: () => setMemberAdmin(user, true) });
                  if (user.reset_pending) {
                    manage.push({ label: '批准改密请求', icon: CTX_ICONS.key, onClick: () => approvePasswordRequest(user) });
                  }
                }
                if (manage.length) { items.push('-'); items.push(...manage); }
              }

              /* 高级: 删号 / 重新指定 ID。「重新指定 ID」可以对自己生效, 但不能对同为站主的人生效。
                   两个都是高级功能 —— 没开发者功能时都不可见 */
              const advanced = [];
              if (memberCan.remove && devToolsOn() && !isSelf && !isOwner) {
                advanced.push({ label: '删除该用户…', danger: true, icon: CTX_ICONS.userX, onClick: () => deleteMember(user) });
              }
              if (memberCan.remove && devToolsOn() && (!isOwner || isSelf)) {
                advanced.push({ label: '重新指定 ID…', danger: true, icon: CTX_ICONS.key, onClick: () => remapMemberId(user) });
              }
              if (advanced.length) { items.push('-'); items.push(...advanced); }

              showContextMenu(evt, items);
            }

            /* 重新指定 ID: 目标 id 已被占用时后端回 409 → 弹 toast 但不关弹窗
                  (confirmAction 的 onConfirm 返回 false 就留在原地) */
            function remapMemberId(user) {
              confirmAction({
                title: '重新指定 ID',
                message: '确定要更改此用户的 id 吗？这将大量更新数据表\n除非你知道你在做什么，否则请不要轻易使用此功能',
                confirmText: '确定',
                danger: true,
                fields: [{ name: 'id', label: '目标 id', placeholder: '不可与现有用户的ID重合', required: true }],
                onConfirm: async (values) => {
                  const target = parseInt(String((values || {}).id || '').trim(), 10);
                  if (!Number.isInteger(target) || target <= 0) {
                    showToast('目标 id 得是正整数', 'warn');
                    return false;
                  }
                  try {
                    await apiPost('/api/admin/user/remap-id', { confirm: 'RUN', from: user.id, to: target });
                  } catch (err) {
                    showToast(err.message || '改 id 失败', 'error');
                    return false;   // 留在弹窗里, 让人改个别的号再试
                  }
                  showToast('已把 @' + user.username + ' 改成 #' + target, 'ok');
                  reloadMembers();
                  return true;
                }
              });
            }

            /* 授予 / 取消管理员 (仅站长)。服务端 /api/admin/grant|revoke 还会再查一次 '*' */
            async function setMemberAdmin(user, grant) {
              const name = user.nickname || user.username;
              await confirmAction({
                title: (grant ? '设为管理员：' : '取消管理员：') + name,
                message: grant
                  ? '管理员可以删除别人的文章并封禁其他用户。'
                  : '取消后对方就只剩普通成员的权限了。',
                confirmText: grant ? '设为管理员' : '取消管理员',
                warning: '',
                onConfirm: async () => {
                  await apiPost(grant ? '/api/admin/grant' : '/api/admin/revoke', {
                    username: user.username,
                    role: 'admin'
                  });
                  showToast(grant ? '已设为管理员' : '已取消管理员', 'ok');
                  reloadMembers();
                }
              });
            }

            /* 批准「向站长申请改密」: 请求里存的就是加密后的新密码, 直接搬过去生效。
                  站长没有「直接给人设密码」的入口 —— 那等于能冒充任何人 */
            async function approvePasswordRequest(user) {
              const name = user.nickname || user.username;
              await confirmAction({
                title: '批准改密请求',
                message: '同意后 ' + name + ' 申请的那个新密码立即生效，他需要用它重新登录。',
                confirmText: '同意',
                warning: '',
                onConfirm: async () => {
                  await apiPost('/api/admin/password/approve', { username: user.username });
                  showToast('已同意，新密码已生效', 'ok');
                  reloadMembers();
                }
              });
            }

            async function banMember(user) {
              const name = user.nickname || user.username;
              await confirmAction({
                title: '封禁 ' + name,
                message: '封禁立刻生效：其仍然可以浏览站内内容，但无法发送文章。\n站长会收到一封站内信告知。',
                confirmText: '封禁',
                danger: true,
                warning: '',
                fields: [
                  { name: 'reason', label: '理由', placeholder: '请填写合理详实的封禁依据', multiline: true, required: true, maxlength: 300 },
                  { name: 'days', label: '时长', placeholder: '留空表示永久' }
                ],
                onConfirm: async (values, api) => {
                  const days = (values.days || '').trim();
                  if (days && !/^\d+$/.test(days)) {
                    api.setError('天数请填数字（1–3650），留空表示永久');
                    return false;
                  }
                  await apiPost('/api/moderation/ban', {
                    username: user.username,
                    reason: values.reason,
                    days: days || null
                  });
                  showToast('已封禁 ' + user.username, 'ok');
                  reloadMembers();
                }
              });
            }

            async function unbanMember(user) {
              await confirmAction({
                title: '解除封禁',
