                   ① 组信息 (标题 / 简介 / 有效期) 先改 —— 组行要是没了就再也改不成
                   ② 新文件带着这一组的 id 传上去 (而不是又开一组)
                   ③ 逐个文件改标题简介
                   ④ 标了删除的最后删 —— 前面哪一步败了, 文件至少还在, 不会「删完了才发现改错」 */
              const runEditSave = async () => {
                uploadCancelled = false;
                uploadStopRequested = false;
                const guard = lockModal();
                setBusy(true);
                const groupId = editGroup.id;
                const problems = [];
                const gTitle = groupMeta.title.trim();
                const gDesc = groupMeta.desc.trim();
                const oldOnes = queue.filter((item) => item.kind === 'existing');
                const kept = oldOnes.filter((item) => !item.removed);
                const doomed = oldOnes.filter((item) => item.removed);
                const fresh = queue.filter((item) => item.kind !== 'existing');
                const expire = expireSelect.value || 'never';

                /* 「把文件列表清空」= 删整组: 不走下面 ①~④, 直接交给 deleteResource ——
                   那一下会弹验证身份 (密码), 服务端还会再验一次。
                   得**先把工作台关掉**再开那个弹窗: 工作台自己就在 #modal-content 里,
                   不关的话验身份/确认框会把它整个顶掉, 关掉之后就再也回不到工作台了
                   (代价是用户在那两个框上点取消时工作台已经关了 —— 什么都没删, 重新点一次就行) */
                if (!fresh.length && !kept.length && doomed.length) {
                  guard.release();
                  setBusy(false);
                  closeWorkbench();
                  await deleteResource(editGroup, null, false);
                  return;
                }

                // ① 组信息: 只发改动过的字段
                const groupPayload = { id: groupId };
                if (gTitle !== original.title) groupPayload.title = gTitle;
                if (gDesc !== original.desc) groupPayload.description = gDesc;
                if (expireTouched) groupPayload.expire = expire;
                if (Object.keys(groupPayload).length > 1) {
                  try {
                    await apiPost('/api/resource/group', groupPayload);
                  } catch (error) {
                    problems.push('组的标题简介没改成功');
                  }
                }

                // ② 新文件 (进度照上传那条路画)
                let okCount = 0;
                let failCount = 0;
                for (let index = 0; index < fresh.length; index += 1) {
                  if (uploadCancelled) break;
                  const item = fresh[index];
                  item.status = 'uploading';
                  item.percent = 0;
                  item.error = '';
                  renderQueue();
                  try {
                    let sha = item.sha;
                    if (sha === undefined) {
                      // 还没算过 (点得快): 这里补算一次, 两个摘要一起拿
                      const pair = await hashFilePair(item.file).catch(() => ({ sha256: '', sha1: '' }));
                      sha = pair.sha256 || '';
                      item.sha1 = pair.sha1 || '';
                    }
                    item.sha = sha;
                    const info = await uploadResourceFile(item.file, {
                      scope: 'library',
                      title: item.title || '',
                      description: item.desc || '',
                      sha256: sha || '',
                      sha1: item.sha1 || '',
                      expire,
                      group_id: groupId
                    }, (percent) => {
                      item.percent = percent;
                      paintProgress(item.id, percent);
                    });
                    item.status = 'done';
                    item.percent = 100;
                    okCount += 1;
                    if (!info.multipart && !info.md5 && info.id) backfillResourceHash(info.id);
                  } catch (error) {
                    item.status = 'failed';
                    item.error = (error && error.message) || '上传失败';
                    failCount += 1;
                  }
                  renderQueue();
                }

                // ③ 逐个文件改标题简介 (没改过的一个请求都不发)
                for (const item of kept) {
                  if (uploadCancelled) break;
                  const before = original.files[item.fileId] || { title: '', desc: '' };
                  const nowTitle = String(item.title || '').trim();
                  const nowDesc = String(item.desc || '').trim();
                  if (nowTitle === before.title && nowDesc === before.desc) continue;
                  try {
                    await apiPost('/api/resource/group', {
                      id: groupId, file_id: item.fileId, title: nowTitle, description: nowDesc
                    });
                  } catch (error) {
                    problems.push('「' + item.file.name + '」的标题简介没改成功');
                  }
                }

                // ④ 标了删除的
                for (const item of doomed) {
                  if (uploadCancelled) break;
                  try {
                    await apiPost('/api/resource/delete', { id: groupId, file_id: item.fileId });
                  } catch (error) {
                    problems.push('「' + item.file.name + '」没删掉');
                  }
                }

                guard.release();
                setBusy(false);
                if (uploadCancelled) {
                  // 已经发出去的改动都留在服务器上了, 所以直接回详情让人看见实情
                  cancel.disabled = false;
                  showToast('已取消，改动过的部分会保留', 'ok');
                  releasePreviews();
                  closeWorkbench();
                  showDetail(groupId);
                  return;
                }
                if (failCount) problems.push(failCount + ' 个文件没传完');
                if (problems.length) {
                  // 失败的那些留在队列里, 再点一次「确认变更」就只补没成的部分
                  cancel.textContent = '关闭';
                  showToast('变更没有全部完成：' + problems.join('；') + '。可以再点一次「确认变更」重试', 'warn');
                  return;
                }
                showToast(okCount ? '变更已保存，新增 ' + okCount + ' 个文件' : '变更已保存', 'ok');
                releasePreviews();
                closeWorkbench();
                // 一个文件都不剩了 (整组删光) -> 组也跟着走, 回列表
                if (!kept.length && !okCount) goPage('/resource/');
                else showDetail(groupId);
              };

              /* 二次确认 = 点两次: 第一次点只把按钮变成「确定？」,
                 再点一次才真传 (原来那个确认浮层已删, 见 ui.js 的 armTwoStep) */
              const step = armTwoStep(submit, {
                label: editGroup ? '确认变更' : '确认上传',
                armedLabel: '确定？',
                onConfirm: () => {
                  if (uploading || !queue.length) return;
                  if (editGroup) runEditSave();
                  else runUploads();
                }
              });
              /* Ctrl/Cmd+S = 直接执行主按钮。键盘是明确的意图, 所以**不走「点两次」**: 键一按就执行。
                 闭包留在 workbenchHotkey 里, 弹窗关掉后由那个监听里的 #rw-root 判断早退 */
              workbenchHotkey = () => {
                if (uploading || submit.disabled) return;
                if (editGroup) runEditSave();
                else runUploads();
              };
              /* 「移除全部」也走点两次: 清空整队比删一个文件疼多了 */
              armTwoStep(clearAll, { label: '移除全部', armedLabel: '确定？', onConfirm: clearQueue });

              renderQueue();
              syncMetaFields();
            }

            /* 直传那条路 Worker 见不到字节、拿不到 ETag, 传完补一次服务端校验值。
               失败不拦人 (详情页以后还能再补), 但**要再试一次**: 线上实测刚 PUT 完立刻补
               会偶发失败, 隔几秒就正常 */
            function backfillResourceHash(id, round) {
              const attempt = round || 1;
              apiPost('/api/resource/hash', { id }).catch(() => {
                if (attempt < 2) setTimeout(() => backfillResourceHash(id, attempt + 1), 3000);
              });
            }

            /* 小文件走 Worker 中转 (xhrUpload 能报进度), 大文件切分片直传 OSS
               (Worker 的请求体上限与 128MB 内存都不允许中转; 分片这条还能断点续传) */
            async function uploadResourceFile(file, meta, onProgress) {
              if (file.size > RES_INLINE_MAX) {
                return await uploadResourceMultipart(file, meta, onProgress);
              }
              const form = new FormData();
              form.append('file', file);
              Object.keys(meta).forEach((key) => form.append(key, meta[key]));
              return await xhrUpload('POST', '/api/resource/upload', form, onProgress);
            }

            /* 分片上传 + 断点续传: 大文件 (>RES_INLINE_MAX) 切成 8MB 一片, 走 OSS 的 Multipart Upload:
                 init -> (sign -> PUT 分片) × N -> complete
               浏览器只做两件事: 要签名、PUT 分片。**分片清单与 ETag 全在服务端** ——
               桶的 CORS 没暴露任何响应头, 浏览器读不到 ETag, 所以合并那一步由服务端自己 ListParts 拼。
               断点续传: 把「还没传完的那次上传」(对象名 + uploadId) 记在 localStorage 里,
               再选同一个文件时先问服务端它那边收下了哪几片, 只补缺的那些。
               记录里**别存分片清单**: 那是 OSS 那边的事实, 本地记一份只会两边对不上 */
            const RES_PART_BYTES = 8 * 1024 * 1024;   // 与服务端 resource.js 的 RES_PART_BYTES 一致
            /* 「停下来」的标志在模块作用域再放一份: 分片上传那个函数在工作台闭包**外面**
               (上传期间工作台可能已经关了), 闭包里那个 uploadCancelled 它看不到。
               三处同步: 两处开始时清零, cancelUpload 里置位 */
            let uploadStopRequested = false;
            const RES_UPLOAD_LS = 'foraine.resource.uploads';
            const RES_UPLOAD_KEEP_MS = 7 * 24 * 60 * 60 * 1000;
            const RES_UPLOAD_MAX_RECORDS = 30;

            function uploadRecords() {
              try {
                const all = JSON.parse(localStorage.getItem(RES_UPLOAD_LS) || '{}') || {};
                const now = Date.now();
                const clean = {};
                // 太老的 (以及没有 uploadId 的) 顺手丢掉: OSS 那边的碎片的自己做生命周期规则清
                Object.keys(all).forEach((key) => {
                  const rec = all[key];
                  if (rec && rec.upload_id && now - (rec.updatedAt || 0) < RES_UPLOAD_KEEP_MS) clean[key] = rec;
                });
                return clean;
              } catch (error) { return {}; }
            }
            function saveUploadRecords(all) {
              try { localStorage.setItem(RES_UPLOAD_LS, JSON.stringify(all)); } catch (error) { /* 存不下就只是这一次不能续传 */ }
            }
            function readUploadRecord(fp) { return uploadRecords()[fp] || null; }
            function writeUploadRecord(fp, rec) {
              const all = uploadRecords();
              all[fp] = Object.assign({}, rec, { updatedAt: Date.now() });
              const keys = Object.keys(all);
              if (keys.length > RES_UPLOAD_MAX_RECORDS) {
                keys.sort((a, b) => (all[a].updatedAt || 0) - (all[b].updatedAt || 0))
                  .slice(0, keys.length - RES_UPLOAD_MAX_RECORDS).forEach((key) => { delete all[key]; });
              }
              saveUploadRecords(all);
            }
            function dropUploadRecord(fp) {
              const all = uploadRecords();
              delete all[fp];
              saveUploadRecords(all);
            }
            /* 同一个文件 = 名字 + 大小 + 最后修改时间 (改名或改内容都算另一个文件, 不冒着续错的风险) */
            function uploadFingerprint(file) {
              return [file.name || '', file.size || 0, file.lastModified || 0].join('|');
            }
            function partLength(file, number) {
              const from = (number - 1) * RES_PART_BYTES;
              return Math.max(0, Math.min(file.size, from + RES_PART_BYTES) - from);
            }

            /* ---- MD5 (分片收尾要用) ----
               OSS 给每个分片算的 ETag 就是**这一片内容的 MD5 (大写十六进制)**。
               而桶的 CORS 没暴露 ETag 头, 浏览器读不到 OSS 给的那个值, 所以自己算一份
               (桶的 CORS 以后把 ETag 加进「暴露 Headers」的话, 这份就用不上了, 会优先用 OSS 回的)。
               WebCrypto 里没有 MD5, 只能手写: 标准实现, 一次 64 字节 */
            const RES_MD5_SHIFT = [
              7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
              5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
              4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
              6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21
            ];
            const RES_MD5_K = new Uint32Array(64);
            for (let i = 0; i < 64; i += 1) RES_MD5_K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296);

            function md5Hex(bytes) {
              const len = bytes.length;
              const padded = new Uint8Array(((len + 8) >> 6) * 64 + 64);
              padded.set(bytes);
              padded[len] = 0x80;
              const bits = len * 8;
              const tail = padded.length - 8;
              // 长度按小端写 64 位: 低 32 位够用 (分片最大 8MB), 高位照算不误
              const low = bits % 4294967296;
              const high = Math.floor(bits / 4294967296);
              padded[tail] = low & 0xff;
              padded[tail + 1] = (low >>> 8) & 0xff;
              padded[tail + 2] = (low >>> 16) & 0xff;
              padded[tail + 3] = (low >>> 24) & 0xff;
              padded[tail + 4] = high & 0xff;
              padded[tail + 5] = (high >>> 8) & 0xff;
              padded[tail + 6] = (high >>> 16) & 0xff;
              padded[tail + 7] = (high >>> 24) & 0xff;

              let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
              const word = new Uint32Array(16);
              for (let offset = 0; offset < padded.length; offset += 64) {
                for (let i = 0; i < 16; i += 1) {
                  const at = offset + i * 4;
                  word[i] = padded[at] | (padded[at + 1] << 8) | (padded[at + 2] << 16) | (padded[at + 3] << 24);
                }
                let a = a0, b = b0, c = c0, d = d0;
                for (let i = 0; i < 64; i += 1) {
                  let f; let g;
                  if (i < 16) { f = (b & c) | (~b & d); g = i; }
                  else if (i < 32) { f = (d & b) | (~d & c); g = (5 * i + 1) % 16; }
                  else if (i < 48) { f = b ^ c ^ d; g = (3 * i + 5) % 16; }
                  else { f = c ^ (b | ~d); g = (7 * i) % 16; }
                  const sum = (a + f + RES_MD5_K[i] + word[g]) | 0;
                  const rotated = ((sum << RES_MD5_SHIFT[i]) | (sum >>> (32 - RES_MD5_SHIFT[i]))) | 0;
                  a = d; d = c; c = b; b = (b + rotated) | 0;
                }
                a0 = (a0 + a) | 0; b0 = (b0 + b) | 0; c0 = (c0 + c) | 0; d0 = (d0 + d) | 0;
              }
              const hex = (value) => {
                let out = '';
                for (let i = 0; i < 4; i += 1) out += ((value >>> (i * 8)) & 0xff).toString(16).padStart(2, '0');
                return out;
              };
              return (hex(a0) + hex(b0) + hex(c0) + hex(d0)).toUpperCase();
            }

            /* 这一片的 ETag: OSS 回了就用它的, 没回 (CORS 没暴露 ETag) 就自己算 */
            async function partEtag(blob, fromServer) {
              if (fromServer) return fromServer;
              return md5Hex(new Uint8Array(await blob.arrayBuffer()));
            }


            /* 把一个没传完的分片上传真正丢掉: 告诉 OSS 别再留着那些碎片, 并把本地那条记录抹掉。
               用在「把队列里的文件移除」时 —— 那是「我不传这个了」的意思, 而「取消上传」**不算**
               (那个要留着进度, 下次接着传)。失败也不吭声: 桶里多一堆碎片而已, 不拦人。 */
            function giveUpMultipart(file) {
              if (!file || file.size <= RES_INLINE_MAX) return;
              const fp = uploadFingerprint(file);
              const rec = readUploadRecord(fp);
              dropUploadRecord(fp);
              if (!rec) return;
              apiPost('/api/resource/multipart/abort', { key: rec.key, upload_id: rec.upload_id }).catch(() => {});
            }

            /* PUT 一个分片, 顺带报这一片自己的进度 (0~1) 并把 ETag 回给调用方。
               headers 一个都不能少: OSS 拿它们重算签名 (x-oss-date / Authorization / x-oss-content-sha256)。
               ETag 要读得到, 得靠桶的 CORS 把它暴露出来 (暴露 Headers 里写 ETag) —— 写不到就返回空串 */
            function xhrPutPart(url, headers, blob, onPartProgress) {
              return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('PUT', url, true);
                Object.keys(headers || {}).forEach((key) => { xhr.setRequestHeader(key, headers[key]); });
                if (onPartProgress && xhr.upload) {
                  xhr.upload.onprogress = (event) => {
                    if (event.lengthComputable && event.total) onPartProgress(event.loaded / event.total);
                  };
                }
                xhr.onload = () => {
                  if (xhr.status >= 200 && xhr.status < 300) {
                    let etag = '';
                    try { etag = (xhr.getResponseHeader('etag') || '').replace(/"/g, '').trim(); } catch (error) { etag = ''; }
                    resolve(etag);
                  } else reject(new Error('分片上传失败：HTTP ' + xhr.status));
                };
                xhr.onerror = () => reject(new Error('分片上传失败（网络断了）'));
                xhr.send(blob);
              });
            }

            async function uploadResourceMultipart(file, meta, onProgress) {
              const fp = uploadFingerprint(file);
              const total = Math.max(1, Math.ceil(file.size / RES_PART_BYTES));
              let rec = readUploadRecord(fp);
              let have = new Set();
              /* 服务端能不能列分片 (RAM 里给了 oss:ListParts 才行)。能的话收尾也用它那份,
                 本地这串 ETag 就只是「哪几片已经传过」的备用依据 */
              let serverListed = false;

              /* 上次没传完的那次还认得出来吗? 先问服务端它那边收下了哪几片 (最权威);
                 列不了 (RAM 里没给 oss:ListParts) 就退到本地记的那份 —— 本地那串还带着
                 每片的 ETag, 收尾时用得上 */
              if (rec) {
                if (rec.size !== file.size) {
                  dropUploadRecord(fp);
                  rec = null;
                } else {
                  rec.parts = rec.parts || {};
                  const status = await apiPost('/api/resource/multipart/list', {
                    key: rec.key, upload_id: rec.upload_id
                  }).catch(() => null);
                  if (status && status.ok && !status.gone) {
                    have = new Set((status.parts || []).map((part) => part.n));
                    serverListed = true;
                  } else if (status && status.gone) {
                    dropUploadRecord(fp);   // 那次已经没了 (被清掉 / 已经合并过)
                    rec = null;
                  } else {
                    // 服务端列不出来: 按本地记的接着传
                    have = new Set(Object.keys(rec.parts).map((n) => parseInt(n, 10)).filter((n) => n > 0));
                  }
                }
              }

              if (!rec) {
                const created = await apiPost('/api/resource/multipart/init', Object.assign({
                  name: file.name || '', size: file.size, mime: file.type || ''
                }, meta));
                rec = {
                  key: created.key, upload_id: created.upload_id,
                  name: created.name, size: file.size, group_id: created.group_id || null,
                  // 组是不是因超过 5GB 而自动开了防盗链 —— 续传时本地记录里也要有
                  auto_guard: !!created.auto_guard,
                  parts: {}
                };
                writeUploadRecord(fp, rec);
              } else if (have.size) {
                showToast('找到未传完的部分，继续上传「' + (file.name || '') + '」', 'info');
              }

              /* 进度按字节算: 传完的那几片直接记满, 正在传的那一片吃它自己的比例。
                 不给 100 —— 最后那一下要等 complete 成功才算真的完成 */
              let doneBytes = 0;
              have.forEach((number) => { doneBytes += partLength(file, number); });
              const paint = (loadedInPart) => {
                if (!onProgress) return;
                const loaded = Math.min(file.size, doneBytes + loadedInPart);
                onProgress(Math.min(99, Math.round(loaded / file.size * 100)));
              };
              paint(0);

              for (let number = 1; number <= total; number += 1) {
                /* 「取消上传」在**分片边界**停 (与文件边界同一个意思)。
                   停下时**不删记录**: 下次选同一个文件接着传, 这就是断点续传 */
                if (uploadStopRequested) throw new Error('已取消，进度已保留');
                if (have.has(number)) continue;
                const from = (number - 1) * RES_PART_BYTES;
                const blob = file.slice(from, Math.min(file.size, from + RES_PART_BYTES));
                const signed = await apiPost('/api/resource/multipart/sign', {
                  key: rec.key, upload_id: rec.upload_id, parts: [number]
                });
                const one = (signed.parts || [])[0];
                if (!one) throw new Error('准备分片失败');
                const serverEtag = await xhrPutPart(one.url, one.headers, blob, (ratio) => paint(blob.size * ratio));
                /* 每传完一片就把 ETag 写回记录 —— 那就是断点续传的全部家当:
                   下次要收尾时, 这份 {片号: ETag} 就是 complete 的输入 */
                rec.parts[number] = await partEtag(blob, serverEtag);
                have.add(number);
                writeUploadRecord(fp, rec);
                doneBytes += blob.size;
                paint(0);
              }

              const clientParts = Object.keys(rec.parts)
                .map((n) => ({ n: parseInt(n, 10), etag: rec.parts[n] }))
                .filter((part) => part.n > 0 && part.etag)
                .sort((a, b) => a.n - b.n);
              // 服务端列得到分片就用不上本地这份; 列不到时它就是唯一那份
              if (!serverListed && !clientParts.length) throw new Error('拿不到分片校验值，请向站长反馈');

              /* 收尾: 带上元信息 (行是服务端这一步才写的)。
                 对象名已经定死了, 组的 id 要用 init 那一次开出来的那个 —— 续传时
                 meta 里可能根本没有 group_id (那一次上传的队列早没了) */
              const finalMeta = Object.assign({}, meta);
              if (!finalMeta.group_id && rec.group_id) finalMeta.group_id = rec.group_id;
              const info = await apiPost('/api/resource/multipart/complete', Object.assign({
                key: rec.key, upload_id: rec.upload_id,
                name: file.name || '', size: file.size, mime: file.type || '',
                /* 服务端列得到分片时用不上它, 列不到时它就是唯一那份 (以服务端的 ETag 为准优先) */
                parts: clientParts
              }, finalMeta));
              dropUploadRecord(fp);
              if (onProgress) onProgress(100);
              /* 分片这条的 auto_guard 在 init 那一步就回来了 (complete 不看这个) —— 带出去,
                 否则收尾拿到的是 complete 的响应、前端就永远不知道组被自动开了防盗 */
              if (rec.auto_guard && info && !info.auto_guard) info.auto_guard = true;
              return info;
            }

            /* 初始化 */

            document.addEventListener('DOMContentLoaded', () => {
              // 带 ?id= 就是详情: 列表那块整棵不画 (省掉一次白拉的请求)
              const params = new URLSearchParams(location.search);
              const id = parseInt(params.get('id') || '', 10);
              if (Number.isInteger(id)) {
                showDetail(id);
                return;
              }

              state.q = (params.get('q') || '').trim();
              state.kind = (params.get('kind') || '').trim();
              state.uploader = (params.get('uploader') || '').trim();

              const search = document.getElementById('resource-search');
              if (search) {
                search.value = state.q;
                // 打字停 300ms 再查 (每个键都打一次接口没必要); 回车 = 立刻查
                let timer = 0;
                search.addEventListener('input', () => {
                  clearTimeout(timer);
                  timer = setTimeout(() => {
                    state.q = search.value.trim();
                    reload();
                  }, 300);
                });
                search.addEventListener('keydown', (event) => {
                  if (event.key !== 'Enter') return;
                  clearTimeout(timer);
                  state.q = search.value.trim();
                  reload();
                });
              }

              const uploaderSelect = document.getElementById('uploader-select');
              if (uploaderSelect) {
                uploaderSelect.addEventListener('change', () => {
                  state.uploader = uploaderSelect.value;
                  reload();
                });
              }

              const sortLabel = document.getElementById('sort-label');
              if (sortLabel) sortLabel.textContent = RES_SORTS.find((item) => item.key === state.sort).label;

              loadResources(1);

              // 访客 / 被封禁 / 没填邮箱都不该看到「上传」(服务端也各拦一道)
              getCurrentUser().then((user) => {
                if (user && !user.ban && user.email) return;
                document.querySelectorAll('.list-create').forEach((button) => {
                  // 用内联 display 而不是 hidden 属性: .btn-acrylic 自己有 display, [hidden] 会被它盖掉
                  button.style.display = 'none';
                });
              });

              const tagToggle = document.getElementById('tag-toggle');
              if (tagToggle) tagToggle.addEventListener('click', toggleTagDrawer);
              document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') closeTagDrawer();
              });
            });
        </script>
    </body>
</html>
